name: Build OrangeFox - Tanzanite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Clean problematic APT source
      # ------------------------------------------------------------
      - name: Fix APT sources
        run: |
          set -eux

          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources

          sudo rm -rf /var/lib/apt/lists/*
          sudo apt clean
          sudo apt update

      # ------------------------------------------------------------
      # 2. Install build dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get install -y \
            git \
            git-lfs \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            bc \
            bison \
            build-essential \
            flex \
            gperf \
            imagemagick \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libncurses6 \
            libssl-dev \
            libxml2-utils \
            lz4 \
            pngcrush \
            python3 \
            python3-pip \
            squashfs-tools \
            xsltproc \
            zipalign \
            zlib1g-dev

      # ------------------------------------------------------------
      # 3. Checkout repository + Git LFS
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: |
          set -eux

          git lfs install
          git lfs pull

          ls -lh stock/vendor_boot.img

          test -f stock/vendor_boot.img

      # ------------------------------------------------------------
      # 4. Verify stock vendor_boot
      # ------------------------------------------------------------
      - name: Verify stock vendor_boot
        run: |
          set -eux

          sha256sum stock/vendor_boot.img

          SIZE=$(stat -c%s stock/vendor_boot.img)

          echo "Stock vendor_boot size: $SIZE"

          test "$SIZE" -eq 67108864

          echo "Stock vendor_boot is present and 64 MiB."

      # ------------------------------------------------------------
      # 5. Create swap
      # ------------------------------------------------------------
      - name: Create swap
        run: |
          set -eux

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          free -h

      # ------------------------------------------------------------
      # 6. Install repo tool
      # ------------------------------------------------------------
      - name: Install repo tool
        run: |
          set -eux

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version

      # ------------------------------------------------------------
      # 7. Sync OrangeFox
      # ------------------------------------------------------------
      - name: Sync OrangeFox 12.1
        run: |
          set -eux

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            OrangeFox_sync

          cd OrangeFox_sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"

      # ------------------------------------------------------------
      # 8. Verify device tree
      # ------------------------------------------------------------
      - name: Verify Tanzanite tree
        run: |
          set -eux

          test -d fox_12.1/device/xiaomi/tanzanite

          echo "Tanzanite device tree:"
          find fox_12.1/device/xiaomi/tanzanite \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

      # ------------------------------------------------------------
      # 9. Prepare OrangeFox build environment
      # ------------------------------------------------------------
      - name: Configure OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eux

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          # Tanzanite is:
          # - A/B
          # - Virtual A/B
          # - vendor_boot v4
          # - vendor_boot-as-recovery

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          # Use the real stock vendor_boot as the reference.
          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$STOCK"

          # IMPORTANT:
          # Generate an installer that installs only the recovery
          # ramdisk instead of replacing the entire vendor_boot.
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          # Keep installer generation enabled.
          export FOX_PORTS_TMP="$GITHUB_WORKSPACE/fox_installer_tmp"

          mkdir -p "$FOX_PORTS_TMP"

          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"
          echo "FOX_REFERENCE_VENDOR_BOOT_IMAGE=$FOX_REFERENCE_VENDOR_BOOT_IMAGE"
          echo "FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=$FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL"

          source build/envsetup.sh || true

          lunch twrp_tanzanite-eng

      # ------------------------------------------------------------
      # 10. Clean old build output
      # ------------------------------------------------------------
      - name: Clean OrangeFox build
        working-directory: fox_12.1
        run: |
          set -eux

          rm -rf out/target/product/tanzanite

      # ------------------------------------------------------------
      # 11. Build vendor_boot + installer
      # ------------------------------------------------------------
      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eux

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$STOCK"
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1
          export FOX_PORTS_TMP="$GITHUB_WORKSPACE/fox_installer_tmp"

          source build/envsetup.sh || true
          lunch twrp_tanzanite-eng

          mka vendorbootimage -j"$(nproc --all)"

      # ------------------------------------------------------------
      # 12. Locate every generated recovery artifact
      # ------------------------------------------------------------
      - name: Locate generated artifacts
        working-directory: fox_12.1
        run: |
          set -eux

          echo "===== Generated files ====="

          find out/target/product/tanzanite \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.zip" \
              -o -name "*.cpio" \
              -o -name "*.cpio.lz4" \
              -o -name "*ramdisk*" \
            \) \
            -printf "%p %s bytes\n" \
            | sort

      # ------------------------------------------------------------
      # 13. Verify vendor_boot v4 header
      # ------------------------------------------------------------
      - name: Verify generated vendor_boot
        working-directory: fox_12.1
        run: |
          set -eux

          VENDOR_BOOT="out/target/product/tanzanite/vendor_boot.img"

          test -f "$VENDOR_BOOT"

          echo "Generated vendor_boot:"
          ls -lh "$VENDOR_BOOT"

          sha256sum "$VENDOR_BOOT"

          python3 - "$VENDOR_BOOT" <<'PY'
          import struct
          import sys

          path = sys.argv[1]

          with open(path, "rb") as f:
              data = f.read(4096)

          if data[:8] != b"VNDRBOOT":
              raise SystemExit("ERROR: Not a vendor_boot image")

          version = struct.unpack_from("<I", data, 8)[0]
          page_size = struct.unpack_from("<I", data, 12)[0]
          vendor_ramdisk_size = struct.unpack_from("<I", data, 24)[0]
          header_size = struct.unpack_from("<I", data, 2096)[0]
          dtb_size = struct.unpack_from("<I", data, 2100)[0]
          table_size = struct.unpack_from("<I", data, 2112)[0]
          entry_num = struct.unpack_from("<I", data, 2116)[0]
          entry_size = struct.unpack_from("<I", data, 2120)[0]
          bootconfig_size = struct.unpack_from("<I", data, 2124)[0]

          print("magic              :", data[:8])
          print("header version     :", version)
          print("page size          :", page_size)
          print("vendor ramdisk     :", vendor_ramdisk_size)
          print("header size        :", header_size)
          print("dtb size           :", dtb_size)
          print("ramdisk table size :", table_size)
          print("ramdisk entries    :", entry_num)
          print("entry size         :", entry_size)
          print("bootconfig size    :", bootconfig_size)

          if version != 4:
              raise SystemExit("ERROR: vendor_boot is not header v4")

          if page_size != 4096:
              raise SystemExit("ERROR: unexpected page size")

          if header_size != 2128:
              raise SystemExit("ERROR: unexpected vendor_boot v4 header size")

          print("vendor_boot v4 verification PASSED")
          PY

      # ------------------------------------------------------------
      # 14. Find OrangeFox installer ZIP generated by OrangeFox
      # ------------------------------------------------------------
      - name: Find OrangeFox installer
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/final"

          echo "Searching for OrangeFox installer ZIPs..."

          mapfile -t ZIPS < <(
            find out \
              -type f \
              -iname "*.zip" \
              -size +1M \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No installer ZIP was generated."
            exit 1
          fi

          echo "ZIP candidates:"
          printf '%s\n' "${ZIPS[@]}"

          # Prefer ZIPs containing OrangeFox/META-INF.
          SELECTED=""

          for z in "${ZIPS[@]}"; do
            if unzip -l "$z" | grep -q "META-INF/com/google/android"; then
              SELECTED="$z"
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "ERROR: Found ZIPs, but none contains an Android installer structure."
            exit 1
          fi

          echo "Selected installer:"
          echo "$SELECTED"

          cp "$SELECTED" \
            "$GITHUB_WORKSPACE/final/OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM-installer.zip"

      # ------------------------------------------------------------
      # 15. Also copy generated images/ramdisk artifacts
      # ------------------------------------------------------------
      - name: Collect recovery artifacts
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eux

          FINAL="$GITHUB_WORKSPACE/final"

          cp out/target/product/tanzanite/vendor_boot.img \
            "$FINAL/vendor_boot-built.img"

          if [ -f out/target/product/tanzanite/ramdisk.img ]; then
            cp out/target/product/tanzanite/ramdisk.img \
              "$FINAL/ramdisk.img"
          fi

          # Search for recovery ramdisk files.
          find out/target/product/tanzanite \
            -type f \
            \( \
              -name "vendor_ramdisk_recovery.cpio" \
              -o -name "vendor_ramdisk.cpio" \
              -o -name "vendor_ramdisk.cpio.lz4" \
            \) \
            -exec cp {} "$FINAL/" \;

          echo "Final artifacts:"
          find "$FINAL" \
            -maxdepth 1 \
            -type f \
            -printf "%f %s bytes\n" \
            | sort

      # ------------------------------------------------------------
      # 16. Inspect installer ZIP
      # ------------------------------------------------------------
      - name: Inspect installer ZIP
        run: |
          set -eux

          ZIP="$GITHUB_WORKSPACE/final/OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM-installer.zip"

          test -f "$ZIP"

          echo "===== Installer ZIP ====="
          ls -lh "$ZIP"

          echo
          echo "===== ZIP contents ====="
          unzip -l "$ZIP"

          echo
          echo "===== META-INF check ====="

          unzip -l "$ZIP" \
            | grep -E \
              'META-INF/com/google/android/(update-binary|updater-script)' \
            || {
              echo "ERROR: Missing Android installer files."
              exit 1
            }

          echo
          echo "===== Vendor ramdisk check ====="

          unzip -l "$ZIP" \
            | grep -E \
              'vendor_ramdisk|ramdisk' \
            || {
              echo "ERROR: Installer does not contain a recovery ramdisk artifact."
              exit 1
            }

          echo
          echo "Installer structure verification PASSED."

      # ------------------------------------------------------------
      # 17. Save checksums
      # ------------------------------------------------------------
      - name: Generate checksums
        run: |
          set -eux

          cd "$GITHUB_WORKSPACE/final"

          sha256sum * \
            | tee SHA256SUMS.txt

      # ------------------------------------------------------------
      # 18. Upload final artifacts
      # ------------------------------------------------------------
      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM
          path: final/
          if-no-files-found: error
          compression-level: 0
