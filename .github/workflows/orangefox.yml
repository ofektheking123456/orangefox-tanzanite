name: OrangeFox Recovery - Redmi Note 14 4G

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # FREE DISK SPACE
      # ==========================================
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false


      # ==========================================
      # JAVA 11
      # ==========================================
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"


      # ==========================================
      # DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            libreadline-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            python3 \
            python3-pip \
            bc \
            cpio \
            rsync \
            lz4 \
            libssl-dev \
            libelf-dev


      # ==========================================
      # CREATE 16GB SWAP
      # ==========================================
      - name: Create swap
        run: |
          set -e

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo "===== SWAP ====="
          swapon --show
          free -h


      # ==========================================
      # INSTALL REPO TOOL
      # ==========================================
      - name: Install repo tool
        run: |
          set -e

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version


      # ==========================================
      # SYNC ORANGEFOX
      # ==========================================
      - name: Sync OrangeFox
        run: |
          set -e

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            fox_sync

          cd fox_sync

          bash orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"


      # ==========================================
      # CLONE TANZANITE DEVICE TREE
      # ==========================================
      - name: Clone Tanzanite recovery tree
        run: |
          set -e

          mkdir -p fox_12.1/device/xiaomi

          git clone --depth=1 \
            -b fox_12.1 \
            https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery.git \
            fox_12.1/device/xiaomi/tanzanite


      # ==========================================
      # VERIFY DEVICE TREE
      # ==========================================
      - name: Verify device tree
        run: |
          set -e

          test -f \
            fox_12.1/device/xiaomi/tanzanite/fox_tanzanite.mk

          test -f \
            fox_12.1/device/xiaomi/tanzanite/twrp_tanzanite.mk

          test -f \
            fox_12.1/device/xiaomi/tanzanite/BoardConfig.mk

          test -f \
            fox_12.1/device/xiaomi/tanzanite/prebuilt/dtb

          echo "======================================"
          echo "Tanzanite device tree: OK"
          echo "======================================"


      # ==========================================
      # SHOW DEVICE CONFIGURATION
      # ==========================================
      - name: Show device configuration
        run: |
          echo "======================================"
          echo "BOARD CONFIGURATION"
          echo "======================================"

          grep -E \
            'BOARD_BOOT_HEADER_VERSION|BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE|BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT|BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE|BOARD_USES_GENERIC_KERNEL_IMAGE' \
            fox_12.1/device/xiaomi/tanzanite/BoardConfig.mk \
            || true

          echo ""
          echo "======================================"
          echo "DEVICE TREE FILES"
          echo "======================================"

          ls -lah \
            fox_12.1/device/xiaomi/tanzanite/


      # ==========================================
      # BUILD ORANGEFOX
      # ==========================================
      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOADING ORANGEFOX ENVIRONMENT"
          echo "======================================"

          source build/envsetup.sh || true


          # ======================================
          # VENDOR_BOOT RECOVERY
          # Android Boot Header Version 4
          # ======================================

          export FOX_VENDOR_BOOT_RECOVERY=1

          echo ""
          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"


          # ======================================
          # A/B CONFIGURATION
          # ======================================

          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"


          # ======================================
          # SELECT TANZANITE
          # ======================================

          echo ""
          echo "======================================"
          echo "SELECTING TANZANITE"
          echo "======================================"

          lunch twrp_tanzanite-eng


          # ======================================
          # BUILD VENDOR_BOOT
          # ======================================

          echo ""
          echo "======================================"
          echo "BUILDING ORANGEFOX"
          echo "======================================"

          mka vendorbootimage -j"$(nproc --all)"


          echo ""
          echo "======================================"
          echo "BUILD FINISHED"
          echo "======================================"


      # ==========================================
      # INSPECT BUILD OUTPUT
      # ==========================================
      - name: Inspect build output
        if: always()
        shell: bash
        run: |

          OUT="fox_12.1/out/target/product/tanzanite"

          echo "======================================"
          echo "PRODUCT OUTPUT"
          echo "======================================"

          if [ ! -d "$OUT" ]; then
            echo "Product output directory does not exist."
            exit 0
          fi


          echo ""
          echo "======================================"
          echo "ALL IMG FILES"
          echo "======================================"

          find "$OUT" \
            -type f \
            -name "*.img" \
            -printf '%p (%s bytes)\n' \
            2>/dev/null \
            || true


          echo ""
          echo "======================================"
          echo "ALL CPIO FILES"
          echo "======================================"

          find "$OUT" \
            -type f \
            -name "*.cpio" \
            -printf '%p (%s bytes)\n' \
            2>/dev/null \
            || true


          echo ""
          echo "======================================"
          echo "ALL ORANGEFOX ZIP FILES"
          echo "======================================"

          find "$OUT" \
            -type f \
            -iname "*orangefox*.zip" \
            -printf '%p (%s bytes)\n' \
            2>/dev/null \
            || true


          echo ""
          echo "======================================"
          echo "RECOVERY DIRECTORY"
          echo "======================================"

          find "$OUT/recovery" \
            -maxdepth 2 \
            -type f \
            -printf '%p (%s bytes)\n' \
            2>/dev/null \
            || true


      # ==========================================
      # PACKAGE BUILD FILES
      # ==========================================
      - name: Package OrangeFox
        shell: bash
        run: |

          set -e

          OUT="fox_12.1/out/target/product/tanzanite"

          mkdir -p release/orangefox


          echo "======================================"
          echo "COLLECTING ORANGEFOX FILES"
          echo "======================================"


          # --------------------------------------
          # Collect CPIO files
          # --------------------------------------

          find "$OUT" \
            -type f \
            -name "*.cpio" \
            -exec cp {} release/orangefox/ \;


          # --------------------------------------
          # Collect IMG files
          # --------------------------------------

          find "$OUT" \
            -type f \
            -name "*.img" \
            -exec cp {} release/orangefox/ \;


          echo ""
          echo "======================================"
          echo "PACKAGE CONTENTS"
          echo "======================================"

          ls -lah release/orangefox


          # --------------------------------------
          # Make sure something was produced
          # --------------------------------------

          if [ -z "$(find release/orangefox \
            -type f \
            -print \
            -quit)" ]; then

            echo ""
            echo "ERROR: No OrangeFox build files were found."
            exit 1

          fi


          # --------------------------------------
          # Create ZIP
          # --------------------------------------

          ZIP_NAME="OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}.zip"

          echo ""
          echo "======================================"
          echo "CREATING ZIP"
          echo "======================================"

          cd release/orangefox

          zip -9 \
            "../../${ZIP_NAME}" \
            ./*

          cd ../..


          echo ""
          echo "======================================"
          echo "FINAL ZIP"
          echo "======================================"

          ls -lh \
            "${ZIP_NAME}"


          echo ""
          echo "======================================"
          echo "ZIP CONTENTS"
          echo "======================================"

          unzip -l \
            "${ZIP_NAME}"


      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================
      - name: Upload OrangeFox ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-${{ github.run_number }}
          path: OrangeFox-tanzanite-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 90


      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orangefox-tanzanite-${{ github.run_number }}
          name: OrangeFox Tanzanite Build ${{ github.run_number }}
          generate_release_notes: true
          files: OrangeFox-tanzanite-${{ github.run_number }}.zip
