name: Build OrangeFox Tanzanite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Pull Git LFS files
        shell: bash
        run: |
          set -e
          git lfs install
          git lfs pull

      - name: Remove problematic Google Chrome APT repository
        shell: bash
        run: |
          set -e

          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources

          sudo rm -rf /var/lib/apt/lists/*
          sudo apt clean
          sudo apt update

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt install -y \
            git \
            git-lfs \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            bc \
            bison \
            build-essential \
            flex \
            gperf \
            imagemagick \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libncurses6 \
            libssl-dev \
            libxml2-utils \
            lz4 \
            pngcrush \
            python3 \
            python3-pip \
            squashfs-tools \
            xsltproc \
            zipalign \
            zlib1g-dev

      - name: Create swap
        shell: bash
        run: |
          set -e

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          free -h

      - name: Install repo tool
        shell: bash
        run: |
          set -e

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            OrangeFox_sync

          cd OrangeFox_sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"

      - name: Clone Tanzanite recovery tree
        shell: bash
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch fox_12.1 \
            https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery.git \
            "$GITHUB_WORKSPACE/fox_12.1/device/xiaomi/tanzanite"

      - name: Verify stock vendor_boot
        shell: bash
        run: |
          set -e

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          echo "Checking stock vendor_boot..."

          if [ ! -f "$STOCK" ]; then
            echo "ERROR: stock/vendor_boot.img not found"
            exit 1
          fi

          SIZE=$(stat -c%s "$STOCK")
          SHA=$(sha256sum "$STOCK" | awk '{print $1}')

          echo "Stock size: $SIZE"
          echo "Stock SHA256: $SHA"

          if [ "$SIZE" -ne 67108864 ]; then
            echo "ERROR: stock vendor_boot.img is not 64 MiB"
            exit 1
          fi

          if [ "$SHA" != "9cbb1b2bc1278e46a5cb99b30925bc607d3ecea40e8e61ccf42f4c2dac225d26" ]; then
            echo "ERROR: stock vendor_boot.img SHA256 does not match"
            exit 1
          fi

          echo "Stock vendor_boot verified."

      - name: Prepare OrangeFox build environment
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eo pipefail

          echo "Preparing OrangeFox environment..."

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          export FOX_TARGET_DEVICES=tanzanite

          export FOX_PORTS_TMP="$GITHUB_WORKSPACE/fox_installer_tmp"

          mkdir -p "$FOX_PORTS_TMP"

          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"
          echo "FOX_REFERENCE_VENDOR_BOOT_IMAGE=$FOX_REFERENCE_VENDOR_BOOT_IMAGE"
          echo "FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=$FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL"
          echo "FOX_TARGET_DEVICES=$FOX_TARGET_DEVICES"

      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eo pipefail

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          export FOX_TARGET_DEVICES=tanzanite

          export FOX_PORTS_TMP="$GITHUB_WORKSPACE/fox_installer_tmp"

          mkdir -p "$FOX_PORTS_TMP"

          echo "=========================================="
          echo "OrangeFox Tanzanite Build"
          echo "=========================================="

          echo "Stock vendor_boot:"
          ls -lh "$FOX_REFERENCE_VENDOR_BOOT_IMAGE"

          echo
          echo "Sourcing OrangeFox environment..."

          source build/envsetup.sh || true

          echo
          echo "Running lunch..."

          lunch twrp_tanzanite-eng

          echo
          echo "Starting vendor_bootimage build..."

          mka vendorbootimage -j"$(nproc --all)"

      - name: Inspect build output
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "ALL RECOVERY/VENDOR RAMDISK OUTPUTS"
          echo "=========================================="

          if [ ! -d out ]; then
            echo "ERROR: out directory does not exist"
            exit 1
          fi

          find out -type f \
            \( \
              -iname "*.img" \
              -o -iname "*.cpio" \
              -o -iname "*.cpio.lz4" \
              -iname "*vendor_ramdisk*" \
              -o -iname "*ramdisk*" \
            \) \
            -printf "%p | %s bytes\n" \
            | sort

          echo
          echo "=========================================="
          echo "ALL CPIO/LZ4 FILES"
          echo "=========================================="

          find out -type f \
            \( \
              -name "*.cpio" \
              -o -name "*.cpio.lz4" \
              -o -name "*.cpio.xz" \
              -o -name "*.cpio.zst" \
            \) \
            -printf "%p | %s bytes\n" \
            | sort || true

      - name: Verify OrangeFox vendor_boot image
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eo pipefail

          FOX_IMG=$(find out -type f \
            -name "OrangeFox-*.img" \
            -size 64M \
            | head -n 1)

          if [ -z "$FOX_IMG" ]; then
            echo "ERROR: OrangeFox 64 MiB image not found"
            exit 1
          fi

          echo "OrangeFox image:"
          echo "$FOX_IMG"

          SIZE=$(stat -c%s "$FOX_IMG")
          SHA=$(sha256sum "$FOX_IMG" | awk '{print $1}')

          echo
          echo "Size: $SIZE"
          echo "SHA256: $SHA"

          echo
          echo "Header:"

          xxd -l 64 "$FOX_IMG"

          MAGIC=$(dd if="$FOX_IMG" bs=1 count=8 2>/dev/null)

          if [ "$MAGIC" != "VNDRBOOT" ]; then
            echo "ERROR: OrangeFox image does not contain VNDRBOOT header"
            exit 1
          fi

          echo
          echo "OrangeFox vendor_boot image looks valid."

      - name: Find generated vendor_boot
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eo pipefail

          echo "=========================================="
          echo "GENERATED vendor_boot.img FILES"
          echo "=========================================="

          find out -type f \
            -name "vendor_boot.img" \
            -printf "%p | %s bytes\n" \
            | sort

      - name: Collect all build artifacts
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eo pipefail

          ARTIFACTS="$GITHUB_WORKSPACE/artifacts"

          rm -rf "$ARTIFACTS"

          mkdir -p "$ARTIFACTS"
          mkdir -p "$ARTIFACTS/vendor_ramdisk"

          echo "=========================================="
          echo "Collecting OrangeFox image"
          echo "=========================================="

          FOX_IMG=$(find out -type f \
            -name "OrangeFox-*.img" \
            -size 64M \
            | head -n 1)

          if [ -n "$FOX_IMG" ]; then
            cp "$FOX_IMG" \
              "$ARTIFACTS/OrangeFox-R12.0-tanzanite.img"

            echo "Copied:"
            echo "$FOX_IMG"
          fi

          echo
          echo "=========================================="
          echo "Collecting vendor_boot.img"
          echo "=========================================="

          VENDOR_BOOT=$(find out -type f \
            -name "vendor_boot.img" \
            -size 64M \
            | head -n 1)

          if [ -n "$VENDOR_BOOT" ]; then
            cp "$VENDOR_BOOT" \
              "$ARTIFACTS/vendor_boot.img"

            echo "Copied:"
            echo "$VENDOR_BOOT"
          fi

          echo
          echo "=========================================="
          echo "Collecting ramdisk.img"
          echo "=========================================="

          RAMDISK=$(find out -type f \
            -name "ramdisk.img" \
            | head -n 1)

          if [ -n "$RAMDISK" ]; then
            cp "$RAMDISK" \
              "$ARTIFACTS/ramdisk.img"

            echo "Copied:"
            echo "$RAMDISK"
          fi

          echo
          echo "=========================================="
          echo "Searching entire out/ tree for vendor ramdisk"
          echo "=========================================="

          find out -type f \
            \( \
              -iname "*vendor_ramdisk*" \
              -o -iname "*vendor*ramdisk*.cpio*" \
              -o -iname "*ramdisk*.cpio*" \
              -o -iname "*ramdisk*.cpio.lz4" \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do
            BASENAME=$(basename "$FILE")

            echo "FOUND: $FILE"

            cp "$FILE" \
              "$ARTIFACTS/vendor_ramdisk/$BASENAME"
          done

          echo
          echo "=========================================="
          echo "Final collected artifacts"
          echo "=========================================="

          find "$ARTIFACTS" -type f \
            -printf "%p | %s bytes\n" \
            | sort

      - name: Decompress vendor ramdisk files
        shell: bash
        run: |
          set -eo pipefail

          DIR="$GITHUB_WORKSPACE/artifacts/vendor_ramdisk"

          if [ ! -d "$DIR" ]; then
            exit 0
          fi

          echo "=========================================="
          echo "Inspecting vendor ramdisk files"
          echo "=========================================="

          shopt -s nullglob

          for FILE in "$DIR"/*; do
            [ -f "$FILE" ] || continue

            echo
            echo "FILE: $FILE"

            file "$FILE" || true

            case "$FILE" in
              *.cpio.lz4)
                OUTPUT="${FILE%.lz4}.cpio"

                echo "Decompressing:"
                echo "$OUTPUT"

                lz4 -d -f "$FILE" "$OUTPUT" || true
                ;;
            esac
          done

          echo
          echo "=========================================="
          echo "After decompression"
          echo "=========================================="

          find "$DIR" -type f \
            -printf "%p | %s bytes\n" \
            | sort

      - name: Create inspection ZIP
        shell: bash
        run: |
          set -eo pipefail

          cd "$GITHUB_WORKSPACE/artifacts"

          zip -r \
            "$GITHUB_WORKSPACE/OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip" \
            .

          echo
          echo "=========================================="
          echo "ZIP created"
          echo "=========================================="

          ls -lh \
            "$GITHUB_WORKSPACE/OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip"

          echo
          unzip -l \
            "$GITHUB_WORKSPACE/OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip"

      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM
          path: |
            OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip
            artifacts/
          if-no-files-found: error
