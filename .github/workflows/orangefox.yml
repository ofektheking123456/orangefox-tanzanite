      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          echo "===== Loading OrangeFox environment ====="
          source build/envsetup.sh || true

          echo "===== Selecting Tanzanite ====="
          lunch twrp_tanzanite-eng

          echo "===== Building vendor_boot ====="
          mka vendorbootimage -j"$(nproc --all)"

          echo "===== Build finished ====="

      - name: Collect images
        shell: bash
        run: |
          set -e

          OUT="fox_12.1/out/target/product/tanzanite"
          mkdir -p release

          echo "===== PRODUCT OUTPUT ====="
          ls -lah "$OUT"

          echo "===== ALL IMG FILES ====="
          find "$OUT" -type f -name "*.img" -printf '%p (%s bytes)\n'

          echo "===== COPYING IMAGES ====="

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -name "*.img" \
            -exec cp {} release/ \;

          echo "===== RELEASE CONTENTS ====="
          ls -lah release

          if ! find release -type f -name "*.img" -print -quit | grep -q .; then
            echo "ERROR: No IMG files were produced."
            exit 1
          fi

          cd release
          zip -9 "../OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}.zip" ./*.img

          echo "===== FINAL ZIP ====="
          ls -lh "../OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}.zip"
