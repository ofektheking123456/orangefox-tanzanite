name: OrangeFox Recovery Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ---------------------------------------------------------
      # Checkout this repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            lz4 \
            lzip \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      # ---------------------------------------------------------
      # Install Java 11
      # ---------------------------------------------------------
      - name: Install Java 11
        run: |
          sudo apt-get install -y openjdk-11-jdk

          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-11-openjdk-amd64/bin" >> "$GITHUB_PATH"

          java -version

      # ---------------------------------------------------------
      # Create extra swap
      # ---------------------------------------------------------
      - name: Create swap
        run: |
          set -e

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo "===== SWAP ====="
          swapon --show

          echo "===== MEMORY ====="
          free -h

      # ---------------------------------------------------------
      # Install repo
      # ---------------------------------------------------------
      - name: Install repo tool
        run: |
          set -e

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version

      # ---------------------------------------------------------
      # Sync OrangeFox 12.1
      # ---------------------------------------------------------
      - name: Sync OrangeFox sources
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          echo "===== Cloning OrangeFox sync tool ====="

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            OrangeFox_sync

          cd "$GITHUB_WORKSPACE/OrangeFox_sync"

          chmod +x orangefox_sync.sh

          echo "===== Syncing OrangeFox 12.1 ====="

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"

          test -d "$GITHUB_WORKSPACE/fox_12.1"

      # ---------------------------------------------------------
      # Clone Tanzanite device tree
      # ---------------------------------------------------------
      - name: Clone Tanzanite recovery tree
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/fox_12.1"

          echo "===== Cloning Tanzanite device tree ====="

          rm -rf device/xiaomi/tanzanite

          git clone \
            --depth=1 \
            --branch fox_12.1 \
            https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery.git \
            device/xiaomi/tanzanite

          echo "===== Checking device tree ====="

          test -f device/xiaomi/tanzanite/BoardConfig.mk
          test -f device/xiaomi/tanzanite/fox_tanzanite.mk

          echo "===== Device tree ====="
          ls -la device/xiaomi/tanzanite
           
      - name: Add stock vendor_boot reference
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/fox_12.1/device/xiaomi/tanzanite/prebuilt"

          cp "$GITHUB_WORKSPACE/stock/vendor_boot.img" \
             "$GITHUB_WORKSPACE/fox_12.1/device/xiaomi/tanzanite/prebuilt/stock-vendor_boot.img"
             
      # ---------------------------------------------------------
      # Build OrangeFox
      # ---------------------------------------------------------
      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " Loading OrangeFox environment"
          echo "========================================"

          source build/envsetup.sh || true

          echo "===== ENVSETUP FINISHED ====="

          echo "===== Vendor boot recovery ====="

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"

          echo "========================================"
          echo " Selecting Tanzanite"
          echo "========================================"

          lunch twrp_tanzanite-eng

          echo "========================================"
          echo " Starting OrangeFox build"
          echo "========================================"

          mka vendorbootimage -j"$(nproc --all)"

          echo "========================================"
          echo " OrangeFox build finished"
          echo "========================================"

      # ---------------------------------------------------------
      # Inspect build output
      # ---------------------------------------------------------
      - name: Inspect build output
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"

          echo "========================================"
          echo " PRODUCT OUTPUT"
          echo "========================================"

          find "$PRODUCT" \
            -maxdepth 2 \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

          echo
          echo "========================================"
          echo " SEARCHING FOR VENDOR RAMDISK"
          echo "========================================"

          find "$PRODUCT" \
            -type f \
            \( \
              -name "vendor_ramdisk.cpio.lz4" \
              -o -name "vendor_ramdisk*.cpio*" \
              -o -name "ramdisk*.img" \
            \) \
            -print

          echo
          echo "========================================"
          echo " ORANGEFOX IMAGES"
          echo "========================================"

          find "$PRODUCT" \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.cpio*" \
            \) \
            -printf "%p %s bytes\n" \
            | sort

          echo
          echo "========================================"
          echo " CHECKING MAIN ORANGEFOX IMAGE"
          echo "========================================"

          FOX_IMAGE=$(find "$PRODUCT" \
            -maxdepth 1 \
            -type f \
            -name "OrangeFox-*.img" \
            | head -n 1)

          if [ -n "$FOX_IMAGE" ]; then
            echo "Found:"
            echo "$FOX_IMAGE"
            ls -lh "$FOX_IMAGE"
          else
            echo "ERROR: OrangeFox image was not found"
            exit 1
          fi

      # ---------------------------------------------------------
      # Collect vendor ramdisk intermediate
      # ---------------------------------------------------------
      - name: Collect vendor ramdisk
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"
          EXTRA="$PRODUCT/orangefox-extra"

          mkdir -p "$EXTRA"

          echo "========================================"
          echo " SEARCHING FOR vendor_ramdisk.cpio.lz4"
          echo "========================================"

          RAMDISK=$(find "$PRODUCT" \
            -type f \
            -name "vendor_ramdisk.cpio.lz4" \
            | head -n 1)

          if [ -z "$RAMDISK" ]; then
            echo "ERROR: vendor_ramdisk.cpio.lz4 was not found"
            echo
            echo "All CPIO/LZ4 files:"
            find "$PRODUCT" \
              -type f \
              \( -name "*.cpio" -o -name "*.cpio.lz4" \) \
              -print

            exit 1
          fi

          echo "Found:"
          echo "$RAMDISK"

          cp "$RAMDISK" \
            "$EXTRA/vendor_ramdisk.cpio.lz4"

          echo "========================================"
          echo " DECOMPRESSING VENDOR RAMDISK"
          echo "========================================"

          lz4 -d \
            "$EXTRA/vendor_ramdisk.cpio.lz4" \
            "$EXTRA/vendor_ramdisk.cpio"

          echo "========================================"
          echo " RAMDISK FILES"
          echo "========================================"

          ls -lh "$EXTRA"

          echo
          echo "========================================"
          echo " CPIO HEADER"
          echo "========================================"

          xxd -l 16 "$EXTRA/vendor_ramdisk.cpio"

          echo
          echo "========================================"
          echo " CPIO CONTENTS"
          echo "========================================"

          mkdir -p "$EXTRA/ramdisk_contents"

          cd "$EXTRA/ramdisk_contents"

          cpio -itv \
            < ../vendor_ramdisk.cpio \
            | tee ../ramdisk_contents.txt

      # ---------------------------------------------------------
      # Package final files
      # ---------------------------------------------------------
      - name: Package OrangeFox files
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"

          PACKAGE="$GITHUB_WORKSPACE/OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}"

          rm -rf "$PACKAGE"

          mkdir -p "$PACKAGE"

          echo "========================================"
          echo " COPYING FINAL IMAGES"
          echo "========================================"

          # OrangeFox image
          find "$PRODUCT" \
            -maxdepth 1 \
            -type f \
            -name "OrangeFox-*.img" \
            -exec cp {} "$PACKAGE/" \;

          # vendor_boot image
          if [ -f "$PRODUCT/vendor_boot.img" ]; then
            cp "$PRODUCT/vendor_boot.img" "$PACKAGE/"
          fi

          # ramdisk image
          if [ -f "$PRODUCT/ramdisk.img" ]; then
            cp "$PRODUCT/ramdisk.img" "$PACKAGE/"
          fi

          # Vendor ramdisk intermediate
          if [ -f "$PRODUCT/orangefox-extra/vendor_ramdisk.cpio.lz4" ]; then
            cp \
              "$PRODUCT/orangefox-extra/vendor_ramdisk.cpio.lz4" \
              "$PACKAGE/"
          fi

          if [ -f "$PRODUCT/orangefox-extra/vendor_ramdisk.cpio" ]; then
            cp \
              "$PRODUCT/orangefox-extra/vendor_ramdisk.cpio" \
              "$PACKAGE/"
          fi

          # Contents listing
          if [ -f "$PRODUCT/orangefox-extra/ramdisk_contents.txt" ]; then
            cp \
              "$PRODUCT/orangefox-extra/ramdisk_contents.txt" \
              "$PACKAGE/"
          fi

          echo
          echo "========================================"
          echo " PACKAGE CONTENTS"
          echo "========================================"

          ls -lh "$PACKAGE"

          echo
          echo "========================================"
          echo " CREATING ZIP"
          echo "========================================"

          cd "$GITHUB_WORKSPACE"

          zip -9 -r \
            "OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}.zip" \
            "$(basename "$PACKAGE")"

          echo
          echo "========================================"
          echo " FINAL ZIP"
          echo "========================================"

          ls -lh \
            "OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}.zip"

      # ---------------------------------------------------------
      # Upload GitHub Actions artifact
      # ---------------------------------------------------------
      - name: Upload OrangeFox artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-${{ github.run_number }}
          path: |
            OrangeFox-tanzanite-${{ github.run_number }}.zip
          compression-level: 0
          if-no-files-found: error

      # ---------------------------------------------------------
      # Create GitHub Release
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orangefox-tanzanite-${{ github.run_number }}
          name: OrangeFox Tanzanite Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            OrangeFox-tanzanite-${{ github.run_number }}.zip
