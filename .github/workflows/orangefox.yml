name: OrangeFox Recovery Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------
      # Checkout this repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            aria2 \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2-utils \
            lz4 \
            lzop \
            openjdk-11-jdk \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------
      - name: Configure Java
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"

          java -version

      # ------------------------------------------------------------
      # Create extra swap
      # ------------------------------------------------------------
      - name: Create swap
        run: |
          set -e

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo "===== SWAP ====="
          swapon --show

          echo "===== MEMORY ====="
          free -h

      # ------------------------------------------------------------
      # Install repo
      # ------------------------------------------------------------
      - name: Install repo tool
        run: |
          set -e

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version

      # ------------------------------------------------------------
      # Sync OrangeFox fox_12.1
      # ------------------------------------------------------------
      - name: Sync OrangeFox sources
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/fox_12.1"

          cd "$GITHUB_WORKSPACE/fox_12.1"

          echo "===== Initializing OrangeFox ====="

          repo init \
            --depth=1 \
            -u https://gitlab.com/OrangeFox/sync.git \
            -b fox_12.1

          echo "===== Syncing OrangeFox ====="

          repo sync \
            -c \
            --no-tags \
            --no-clone-bundle \
            --force-sync \
            -j"$(nproc --all)"

      # ------------------------------------------------------------
      # Clone Redmi Note 14 4G / Tanzanite tree
      # ------------------------------------------------------------
      - name: Clone Tanzanite device tree
        working-directory: fox_12.1
        run: |
          set -e

          mkdir -p device/xiaomi

          git clone \
            --depth=1 \
            --branch fox_12.1 \
            https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery.git \
            device/xiaomi/tanzanite

      # ------------------------------------------------------------
      # Verify device tree
      # ------------------------------------------------------------
      - name: Verify Tanzanite tree
        working-directory: fox_12.1
        run: |
          set -e

          echo "===== DEVICE TREE ====="

          test -d device/xiaomi/tanzanite
          test -f device/xiaomi/tanzanite/BoardConfig.mk
          test -f device/xiaomi/tanzanite/device.mk

          echo "===== BOARD CONFIG ====="
          grep -E \
            'BOARD_BOOT_HEADER_VERSION|BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE|BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT|BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE|BOARD_USES_GENERIC_KERNEL_IMAGE' \
            device/xiaomi/tanzanite/BoardConfig.mk || true

      # ------------------------------------------------------------
      # Load OrangeFox build environment
      # ------------------------------------------------------------
      - name: Configure OrangeFox environment
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          echo "===== Loading OrangeFox environment ====="

          source build/envsetup.sh || true

          echo "===== ENVSETUP FINISHED ====="

          # --------------------------------------------------------
          # Tanzanite is:
          # - Android boot header v4
          # - A/B
          # - Virtual A/B
          # - vendor_boot-as-recovery
          # --------------------------------------------------------

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          echo "===== ORANGEFOX VARIABLES ====="

          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=$FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"

          # Save them for the next step too.
          {
            echo "FOX_VENDOR_BOOT_RECOVERY=1"
            echo "FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1"
            echo "FOX_AB_DEVICE=1"
            echo "FOX_VIRTUAL_AB_DEVICE=1"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Build OrangeFox vendor_boot recovery
      # ------------------------------------------------------------
      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          echo "===== Loading OrangeFox environment ====="

          source build/envsetup.sh || true

          echo "===== Selecting Tanzanite ====="

          lunch twrp_tanzanite-eng

          echo "===== Checking variables ====="

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=$FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL"

          echo "===== Starting vendor_boot build ====="

          mka vendorbootimage -j"$(nproc --all)"

      # ------------------------------------------------------------
      # Inspect EVERYTHING generated
      # ------------------------------------------------------------
      - name: Inspect build output
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          OUT="out/target/product/tanzanite"

          echo "=================================================="
          echo "ALL TANZANITE OUTPUT"
          echo "=================================================="

          find "$OUT" -type f -printf '%p | %s bytes\n' | sort

          echo
          echo "=================================================="
          echo "RECOVERY / VENDOR BOOT FILES"
          echo "=================================================="

          find "$OUT" -type f \
            \( \
              -name "*.img" \
              -o -name "*.cpio" \
              -o -name "*.zip" \
              -o -name "*.md5" \
            \) \
            -printf '%p | %s bytes\n' | sort

          echo
          echo "=================================================="
          echo "SEARCHING FOR vendor_ramdisk_recovery.cpio"
          echo "=================================================="

          find "$OUT" -type f \
            -name "vendor_ramdisk_recovery.cpio" \
            -printf '%p | %s bytes\n' \
            || true

          echo
          echo "=================================================="
          echo "SEARCHING FOR ORANGEFOX ZIP"
          echo "=================================================="

          find "$OUT" -type f \
            -iname "*OrangeFox*.zip" \
            -printf '%p | %s bytes\n' \
            || true

          # --------------------------------------------------------
          # Build #15 MUST contain the recovery CPIO.
          # If it doesn't, stop the workflow rather than producing
          # another misleading ZIP.
          # --------------------------------------------------------

          CPIO="$(find "$OUT" -type f \
            -name "vendor_ramdisk_recovery.cpio" \
            -print -quit)"

          if [ -z "$CPIO" ]; then
            echo
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "ERROR: vendor_ramdisk_recovery.cpio was NOT generated."
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo
            echo "The build is NOT ready to flash."
            exit 1
          fi

          echo
          echo "===== FOUND RECOVERY CPIO ====="
          echo "$CPIO"
          ls -lh "$CPIO"

      # ------------------------------------------------------------
      # Package verified artifacts
      # ------------------------------------------------------------
      - name: Package OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          OUT="out/target/product/tanzanite"
          PKG="$GITHUB_WORKSPACE/OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}"

          rm -rf "$PKG"
          mkdir -p "$PKG"

          echo "===== Copying verified recovery ramdisk ====="

          CPIO="$(find "$OUT" -type f \
            -name "vendor_ramdisk_recovery.cpio" \
            -print -quit)"

          cp "$CPIO" "$PKG/vendor_ramdisk_recovery.cpio"

          echo "===== Copying generated OrangeFox ZIPs ====="

          find "$OUT" -type f \
            -iname "*OrangeFox*.zip" \
            -exec cp {} "$PKG/" \; \
            || true

          echo "===== Copying diagnostic images ====="

          find "$OUT" -maxdepth 1 -type f \
            \( \
              -name "vendor_boot.img" \
              -o -name "recovery.img" \
              -o -name "OrangeFox*.img" \
              -o -name "ramdisk.img" \
            \) \
            -exec cp {} "$PKG/" \; \
            || true

          echo "===== PACKAGE CONTENTS ====="

          find "$PKG" -type f \
            -printf '%f | %s bytes\n' \
            | sort

          echo "===== Creating ZIP ====="

          cd "$PKG"

          zip -9 -r \
            "$GITHUB_WORKSPACE/OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}.zip" \
            .

          echo
          echo "===== FINAL ZIP ====="

          ls -lh \
            "$GITHUB_WORKSPACE/OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}.zip"

      # ------------------------------------------------------------
      # SHA256
      # ------------------------------------------------------------
      - name: Generate SHA256
        run: |
          set -e

          sha256sum \
            "OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}.zip" \
            | tee "OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}.sha256"

      # ------------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------------
      - name: Upload OrangeFox ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-${{ github.run_number }}
          path: |
            OrangeFox-tanzanite-${{ github.run_number }}.zip
            OrangeFox-tanzanite-${{ github.run_number }}.sha256
          if-no-files-found: error

      # ------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orangefox-tanzanite-build-${{ github.run_number }}
          name: OrangeFox Tanzanite Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            OrangeFox-tanzanite-${{ github.run_number }}.zip
            OrangeFox-tanzanite-${{ github.run_number }}.sha256
            ```
