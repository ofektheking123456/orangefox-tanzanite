name: OrangeFox Recovery Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true


      # ============================================================
      # PULL GIT LFS FILES
      # ============================================================

      - name: Pull Git LFS files
        shell: bash
        run: |
          set -e

          git lfs install
          git lfs pull

          echo "===== STOCK VENDOR_BOOT ====="

          ls -lh stock/vendor_boot.img
          file stock/vendor_boot.img

          echo "===== SIZE ====="
          stat -c%s stock/vendor_boot.img


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          # Chrome is not required for OrangeFox.
          # Remove its repository to avoid APT Hash Sum mismatch.

          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources

          sudo rm -rf /var/lib/apt/lists/*
          sudo apt clean

          sudo apt update

          sudo apt install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            unzip \
            zip \
            rsync \
            cpio \
            lz4 \
            xz-utils \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            zlib1g-dev \
            libxml2-utils \
            xsltproc \
            openjdk-11-jdk


      # ============================================================
      # INSTALL REPO TOOL
      # ============================================================

      - name: Install repo tool
        shell: bash
        run: |
          set -e

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version


      # ============================================================
      # CREATE SWAP
      # ============================================================

      - name: Create swap
        shell: bash
        run: |
          set -e

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"

          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo "===== SWAP ====="
          swapon --show

          echo "===== MEMORY ====="
          free -h


      # ============================================================
      # SYNC ORANGEFOX 12.1
      # ============================================================

      - name: Sync OrangeFox 12.1
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          mkdir -p "$GITHUB_WORKSPACE/fox_12.1"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            OrangeFox_sync

          cd OrangeFox_sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"


      # ============================================================
      # CLONE TANZANITE DEVICE TREE
      # ============================================================

      - name: Add Tanzanite device tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/fox_12.1"

          mkdir -p device/xiaomi

          git clone \
            --depth=1 \
            --branch fox_12.1 \
            https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery.git \
            device/xiaomi/tanzanite

          echo "===== TANZANITE DEVICE TREE ====="

          ls -la device/xiaomi/tanzanite


      # ============================================================
      # VERIFY STOCK VENDOR_BOOT
      # ============================================================

      - name: Verify stock vendor_boot
        shell: bash
        run: |
          set -e

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          echo "=========================================="
          echo "TARGET DEVICE"
          echo "=========================================="

          echo "Redmi Note 14 4G"
          echo "Codename: tanzanite"

          echo "=========================================="
          echo "TARGET ROM"
          echo "=========================================="

          echo "OS3.0.302.0.WOGMIXM"

          echo "=========================================="
          echo "STOCK VENDOR_BOOT"
          echo "=========================================="

          test -f "$STOCK"

          ls -lh "$STOCK"

          file "$STOCK"

          STOCK_SIZE=$(stat -c%s "$STOCK")

          echo "Size: $STOCK_SIZE bytes"

          # 64 MiB
          test "$STOCK_SIZE" -eq 67108864

          STOCK_SHA=$(sha256sum "$STOCK" | awk '{print $1}')

          echo "SHA256: $STOCK_SHA"

          test "$STOCK_SHA" = \
          "9cbb1b2bc1278e46a5cb99b30925bc607d3ecea40e8e61ccf42f4c2dac225d26"

          echo "=========================================="
          echo "STOCK VENDOR_BOOT VERIFIED"
          echo "=========================================="


      # ============================================================
      # BUILD ORANGEFOX
      # ============================================================

      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          echo "=========================================="
          echo "ORANGEFOX BUILD"
          echo "=========================================="

          echo "Device: tanzanite"
          echo "ROM: OS3.0.302.0.WOGMIXM"
          echo "Android: 16"
          echo "OrangeFox: 12.1"

          echo "=========================================="
          echo "ORANGEFOX VARIABLES"
          echo "=========================================="

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$STOCK"

          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"
          echo "FOX_REFERENCE_VENDOR_BOOT_IMAGE=$FOX_REFERENCE_VENDOR_BOOT_IMAGE"

          echo "=========================================="
          echo "LOADING BUILD ENVIRONMENT"
          echo "=========================================="

          source build/envsetup.sh || true

          echo "=========================================="
          echo "SELECTING TANZANITE"
          echo "=========================================="

          lunch twrp_tanzanite-eng

          echo "=========================================="
          echo "BUILDING VENDOR_BOOT"
          echo "=========================================="

          mka vendorbootimage -j"$(nproc --all)"

          echo "=========================================="
          echo "ORANGEFOX BUILD COMPLETE"
          echo "=========================================="


      # ============================================================
      # VERIFY BUILD
      # ============================================================

      - name: Verify OrangeFox image
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"

          echo "=========================================="
          echo "BUILD VERIFICATION"
          echo "=========================================="

          FOX_IMAGE=$(find "$PRODUCT" \
            -maxdepth 1 \
            -type f \
            -name "OrangeFox-*.img" \
            | head -n 1)

          test -n "$FOX_IMAGE"

          echo "===== ORANGEFOX IMAGE ====="

          ls -lh "$FOX_IMAGE"

          echo "===== SHA256 ====="

          sha256sum "$FOX_IMAGE"

          echo "===== FILE TYPE ====="

          file "$FOX_IMAGE"

          echo "===== HEADER ====="

          xxd -l 32 "$FOX_IMAGE"

          echo "===== GENERATED VENDOR_BOOT ====="

          test -f "$PRODUCT/vendor_boot.img"

          ls -lh "$PRODUCT/vendor_boot.img"

          sha256sum "$PRODUCT/vendor_boot.img"

          echo "===== STOCK REFERENCE ====="

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          STOCK_SHA=$(sha256sum "$STOCK" | awk '{print $1}')

          echo "Stock SHA256: $STOCK_SHA"

          test "$STOCK_SHA" = \
          "9cbb1b2bc1278e46a5cb99b30925bc607d3ecea40e8e61ccf42f4c2dac225d26"

          echo "=========================================="
          echo "BUILD VERIFICATION PASSED"
          echo "=========================================="


      # ============================================================
      # COLLECT VENDOR RAMDISK
      # ============================================================

      - name: Collect vendor ramdisk
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"
          OUT="$GITHUB_WORKSPACE/orangefox-artifacts"

          mkdir -p "$OUT"

          echo "=========================================="
          echo "SEARCHING FOR RAMDISK"
          echo "=========================================="

          find "$PRODUCT" \
            -type f \
            \( \
              -name "vendor_ramdisk.cpio.lz4" \
              -o \
              -name "vendor_ramdisk_recovery.cpio" \
              -o \
              -name "vendor_ramdisk.cpio" \
              -o \
              -name "ramdisk.img" \
            \) \
            -print


          echo "=========================================="
          echo "VENDOR RAMDISK"
          echo "=========================================="

          if [ -f "$PRODUCT/vendor_boot_intermediates/vendor_ramdisk.cpio.lz4" ]; then

            cp \
              "$PRODUCT/vendor_boot_intermediates/vendor_ramdisk.cpio.lz4" \
              "$OUT/vendor_ramdisk.cpio.lz4"

            echo "vendor_ramdisk.cpio.lz4 found."

            lz4 -d \
              "$OUT/vendor_ramdisk.cpio.lz4" \
              "$OUT/vendor_ramdisk.cpio"

            echo "vendor_ramdisk.cpio created."

            ls -lh \
              "$OUT/vendor_ramdisk.cpio.lz4" \
              "$OUT/vendor_ramdisk.cpio"

          else

            echo "WARNING: vendor_ramdisk.cpio.lz4 not found."

          fi


          echo "=========================================="
          echo "RECOVERY RAMDISK"
          echo "=========================================="

          if [ -f "$PRODUCT/vendor_ramdisk_recovery.cpio" ]; then

            cp \
              "$PRODUCT/vendor_ramdisk_recovery.cpio" \
              "$OUT/vendor_ramdisk_recovery.cpio"

            echo "vendor_ramdisk_recovery.cpio found."

          else

            echo "vendor_ramdisk_recovery.cpio not generated."

          fi


          echo "=========================================="
          echo "RAMDISK IMAGE"
          echo "=========================================="

          if [ -f "$PRODUCT/ramdisk.img" ]; then

            cp \
              "$PRODUCT/ramdisk.img" \
              "$OUT/ramdisk.img"

            echo "ramdisk.img found."

          fi


      # ============================================================
      # INSPECT RAMDISK
      # ============================================================

      - name: Inspect vendor ramdisk
        shell: bash
        run: |
          set -e

          OUT="$GITHUB_WORKSPACE/orangefox-artifacts"

          echo "=========================================="
          echo "RAMDISK INSPECTION"
          echo "=========================================="

          if [ -f "$OUT/vendor_ramdisk.cpio" ]; then

            mkdir -p "$OUT/ramdisk_contents"

            cd "$OUT/ramdisk_contents"

            cpio -itv \
              < "$OUT/vendor_ramdisk.cpio" \
              > "$OUT/ramdisk_contents.txt"

            echo "=========================================="
            echo "RECOVERY-RELATED FILES"
            echo "=========================================="

            grep -Ei \
              'recovery|fox|magisk|resetprop|fstab|init\.' \
              "$OUT/ramdisk_contents.txt" \
              || true

            echo "=========================================="
            echo "RAMDISK CONTENTS SAVED"
            echo "=========================================="

            wc -l "$OUT/ramdisk_contents.txt"

          else

            echo "No vendor_ramdisk.cpio available."

          fi


      # ============================================================
      # PACKAGE BUILD ARTIFACTS
      # ============================================================

      - name: Package OrangeFox artifacts
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"
          OUT="$GITHUB_WORKSPACE/orangefox-artifacts"

          mkdir -p "$OUT"

          echo "=========================================="
          echo "COPYING BUILD IMAGES"
          echo "=========================================="

          find "$PRODUCT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "OrangeFox-*.img" \
              -o \
              -name "vendor_boot.img" \
            \) \
            -exec cp {} "$OUT/" \;


          echo "=========================================="
          echo "FINAL ARTIFACTS"
          echo "=========================================="

          find "$OUT" \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n'


      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM-inspection
          path: orangefox-artifacts/
          if-no-files-found: error
          retention-days: 7
