name: OrangeFox Recovery Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        shell: bash
        run: |
          set -e

          git lfs install
          git lfs pull

          echo "===== STOCK VENDOR_BOOT ====="
          ls -lh stock/vendor_boot.img
          file stock/vendor_boot.img


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          # Chrome is not required for OrangeFox.
          # Remove its repository because it can cause
          # Hash Sum mismatch errors on GitHub runners.

          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources

          sudo rm -rf /var/lib/apt/lists/*
          sudo apt clean

          sudo apt update

          sudo apt install -y \
            git \
            curl \
            wget \
            python3 \
            python3-pip \
            unzip \
            zip \
            rsync \
            cpio \
            lz4 \
            xz-utils \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            zlib1g-dev \
            libxml2-utils \
            xsltproc \
            openjdk-11-jdk


      # ============================================================
      # INSTALL REPO TOOL
      # ============================================================

      - name: Install repo tool
        shell: bash
        run: |
          set -e

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version


      # ============================================================
      # CREATE SWAP
      # ============================================================

      - name: Create swap
        shell: bash
        run: |
          set -e

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"

          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo "===== SWAP ====="
          swapon --show

          echo "===== MEMORY ====="
          free -h


      # ============================================================
      # SYNC ORANGEFOX
      # ============================================================

      - name: Sync OrangeFox 12.1
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/fox_12.1"

          cd "$GITHUB_WORKSPACE"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            OrangeFox_sync

          cd OrangeFox_sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"


      # ============================================================
      # CLONE TANZANITE DEVICE TREE
      # ============================================================

      - name: Add Tanzanite device tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/fox_12.1"

          mkdir -p device/xiaomi

          git clone \
            --depth=1 \
            --branch fox_12.1 \
            https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery.git \
            device/xiaomi/tanzanite

          echo "===== DEVICE TREE ====="
          ls -la device/xiaomi/tanzanite


      # ============================================================
      # VERIFY STOCK VENDOR_BOOT
      # ============================================================

      - name: Verify stock vendor_boot
        shell: bash
        run: |
          set -e

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          echo "===== TARGET ROM ====="
          echo "OS3.0.302.0.WOGMIXM"

          echo "===== STOCK VENDOR_BOOT ====="

          test -f "$STOCK"

          ls -lh "$STOCK"

          file "$STOCK"

          STOCK_SIZE=$(stat -c%s "$STOCK")

          echo "Stock size: $STOCK_SIZE bytes"

          # Stock vendor_boot must be 64 MiB.
          test "$STOCK_SIZE" -eq 67108864

          STOCK_SHA=$(sha256sum "$STOCK" | awk '{print $1}')

          echo "Stock SHA256: $STOCK_SHA"

          test "$STOCK_SHA" = \
          "9cbb1b2bc1278e46a5cb99b30925bc607d3ecea40e8e61ccf42f4c2dac225d26"

          echo "Stock vendor_boot SHA256: OK"


      # ============================================================
      # BUILD ORANGEFOX
      # ============================================================

      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          echo "===== BUILD TARGET ====="
          echo "Redmi Note 14 4G"
          echo "Codename: tanzanite"
          echo "ROM: OS3.0.302.0.WOGMIXM"

          echo "===== ORANGEFOX VARIABLES ====="

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          # Use the exact stock vendor_boot from
          # OS3.0.302.0.WOGMIXM as the reference image.

          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$STOCK"

          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"
          echo "FOX_REFERENCE_VENDOR_BOOT_IMAGE=$FOX_REFERENCE_VENDOR_BOOT_IMAGE"

          echo "===== STOCK SHA256 ====="
          sha256sum "$STOCK"

          echo "===== LOADING ENVIRONMENT ====="

          source build/envsetup.sh || true

          echo "===== SELECTING TANZANITE ====="

          lunch twrp_tanzanite-eng

          echo "===== BUILDING VENDOR_BOOT ====="

          mka vendorbootimage -j"$(nproc --all)"

          echo "===== BUILD COMPLETE ====="


      # ============================================================
      # VERIFY BUILD 18
      # ============================================================

      - name: Verify Build 18 image
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"

          echo "===== TARGET ROM ====="
          echo "OS3.0.302.0.WOGMIXM"

          echo "===== ORANGEFOX IMAGE ====="

          FOX_IMAGE=$(find "$PRODUCT" \
            -maxdepth 1 \
            -type f \
            -name "OrangeFox-*.img" \
            | head -n 1)

          test -n "$FOX_IMAGE"

          ls -lh "$FOX_IMAGE"

          echo "===== ORANGEFOX SHA256 ====="
          sha256sum "$FOX_IMAGE"

          echo "===== FILE TYPE ====="
          file "$FOX_IMAGE"

          echo "===== VENDOR BOOT OUTPUT ====="

          test -f "$PRODUCT/vendor_boot.img"

          ls -lh "$PRODUCT/vendor_boot.img"

          sha256sum "$PRODUCT/vendor_boot.img"

          echo "===== VENDOR_BOOT HEADER ====="

          xxd -l 32 "$FOX_IMAGE"

          echo "===== VERIFYING STOCK REFERENCE AGAIN ====="

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          STOCK_SHA=$(sha256sum "$STOCK" | awk '{print $1}')

          echo "Stock SHA256: $STOCK_SHA"

          test "$STOCK_SHA" = \
          "9cbb1b2bc1278e46a5cb99b30925bc607d3ecea40e8e61ccf42f4c2dac225d26"

          echo "Stock vendor_boot SHA256: OK"

          echo "===== BUILD 18 VERIFICATION PASSED ====="


      # ============================================================
      # COLLECT VENDOR RAMDISK
      # ============================================================

      - name: Collect vendor ramdisk
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"

          echo "===== SEARCHING FOR VENDOR RAMDISK ====="

          find "$PRODUCT" \
            -type f \
            \( \
              -name "vendor_ramdisk.cpio.lz4" \
              -o \
              -name "vendor_ramdisk_recovery.cpio" \
              -o \
              -name "ramdisk.img" \
            \) \
            -print


          # --------------------------------------------------------
          # vendor_ramdisk.cpio.lz4
          # --------------------------------------------------------

          if [ -f "$PRODUCT/vendor_boot_intermediates/vendor_ramdisk.cpio.lz4" ]; then

            echo "Found vendor_ramdisk.cpio.lz4"

            cp \
              "$PRODUCT/vendor_boot_intermediates/vendor_ramdisk.cpio.lz4" \
              "$PRODUCT/vendor_ramdisk.cpio.lz4"

            lz4 -d \
              "$PRODUCT/vendor_ramdisk.cpio.lz4" \
              "$PRODUCT/vendor_ramdisk.cpio"

            echo "Vendor ramdisk extracted."

            ls -lh \
              "$PRODUCT/vendor_ramdisk.cpio.lz4" \
              "$PRODUCT/vendor_ramdisk.cpio"

          fi


          # --------------------------------------------------------
          # List ramdisk contents
          # --------------------------------------------------------

          if [ -f "$PRODUCT/vendor_ramdisk.cpio" ]; then

            echo "===== RAMDISK CONTENTS ====="

            mkdir -p "$PRODUCT/ramdisk_contents"

            cd "$PRODUCT/ramdisk_contents"

            cpio -itv \
              < "$PRODUCT/vendor_ramdisk.cpio" \
              > "$PRODUCT/ramdisk_contents.txt"

            echo "Ramdisk contents saved."

          fi


      # ============================================================
      # PACKAGE ARTIFACTS
      # ============================================================

      - name: Package OrangeFox artifacts
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"

          mkdir -p "$GITHUB_WORKSPACE/orangefox-artifacts"

          echo "===== COPYING ARTIFACTS ====="

          find "$PRODUCT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "OrangeFox-*.img" \
              -o \
              -name "vendor_boot.img" \
              -o \
              -name "ramdisk.img" \
              -o \
              -name "vendor_ramdisk.cpio.lz4" \
              -o \
              -name "vendor_ramdisk.cpio" \
              -o \
              -name "ramdisk_contents.txt" \
            \) \
            -exec cp {} "$GITHUB_WORKSPACE/orangefox-artifacts/" \;

          echo "===== ARTIFACTS ====="

          ls -lh "$GITHUB_WORKSPACE/orangefox-artifacts"


      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-OS3.0.302.0.WOGMIXM
          path: orangefox-artifacts/
          if-no-files-found: error
          retention-days: 7
