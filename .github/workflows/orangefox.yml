name: Build OrangeFox - Tanzanite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Fix Ubuntu APT
      # ============================================================
      - name: Fix APT sources
        run: |
          set -eux

          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources

          sudo rm -rf /var/lib/apt/lists/*
          sudo apt clean
          sudo apt update

      # ============================================================
      # 2. Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get install -y \
            git \
            git-lfs \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            bc \
            bison \
            build-essential \
            flex \
            gperf \
            imagemagick \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libncurses6 \
            libssl-dev \
            libxml2-utils \
            lz4 \
            pngcrush \
            python3 \
            python3-pip \
            squashfs-tools \
            xsltproc \
            zipalign \
            zlib1g-dev

      # ============================================================
      # 3. Checkout repository + Git LFS
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: |
          set -eux

          git lfs install
          git lfs pull

          echo "Stock vendor_boot:"
          ls -lh stock/vendor_boot.img

          test -f stock/vendor_boot.img

      # ============================================================
      # 4. Verify stock vendor_boot
      # ============================================================
      - name: Verify stock vendor_boot
        run: |
          set -eux

          echo "SHA256:"
          sha256sum stock/vendor_boot.img

          SIZE=$(stat -c%s stock/vendor_boot.img)

          echo "Size: $SIZE bytes"

          test "$SIZE" -eq 67108864

      # ============================================================
      # 5. Create 16 GB swap
      # ============================================================
      - name: Create swap
        run: |
          set -eux

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          free -h

      # ============================================================
      # 6. Install repo
      # ============================================================
      - name: Install repo tool
        run: |
          set -eux

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version

      # ============================================================
      # 7. Sync OrangeFox
      #
      # R12.0 is the OrangeFox release.
      # 12.1 is the source/manifest branch used by the build.
      # ============================================================
      - name: Sync OrangeFox
        run: |
          set -eux

          rm -rf OrangeFox_sync

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            OrangeFox_sync

          cd OrangeFox_sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"

      # ============================================================
      # 8. Locate Tanzanite device tree automatically
      # ============================================================
      - name: Locate Tanzanite device tree
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eux

          echo "Searching for Tanzanite device tree..."

          FOUND=""

          while IFS= read -r dir; do
            if [ -f "$dir/AndroidProducts.mk" ] ||
               [ -f "$dir/twrp_tanzanite.mk" ] ||
               [ -f "$dir/BoardConfig.mk" ]; then

              if grep -Rqi "tanzanite" "$dir" 2>/dev/null; then
                FOUND="$dir"
                break
              fi
            fi
          done < <(
            find . \
              -type d \
              \( \
                -path "*/device/*" \
                -o \
                -path "*/vendor/*" \
              \) \
              2>/dev/null \
              | sort
          )

          if [ -z "$FOUND" ]; then
            echo "Automatic tree search did not find a direct match."
            echo
            echo "Searching all files containing tanzanite..."
            grep -Ril \
              --exclude-dir=.git \
              "tanzanite" . \
              2>/dev/null \
              | head -100 || true

            echo
            echo "Continuing because the previous OrangeFox build"
            echo "successfully configured twrp_tanzanite."
          else
            echo "Tanzanite tree found at:"
            echo "$FOUND"
          fi

      # ============================================================
      # 9. Configure OrangeFox
      # ============================================================
      - name: Configure OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eux

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          # Use the real stock vendor_boot as reference.
          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$STOCK"

          # Android vendor_boot v4:
          # install only the recovery ramdisk.
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          export FOX_PORTS_TMP="$GITHUB_WORKSPACE/fox_installer_tmp"

          mkdir -p "$FOX_PORTS_TMP"

          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"
          echo "FOX_REFERENCE_VENDOR_BOOT_IMAGE=$FOX_REFERENCE_VENDOR_BOOT_IMAGE"
          echo "FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=$FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL"

          source build/envsetup.sh || true

          lunch twrp_tanzanite-eng

      # ============================================================
      # 10. Build vendor_boot
      # ============================================================
      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eux

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$STOCK"
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1
          export FOX_PORTS_TMP="$GITHUB_WORKSPACE/fox_installer_tmp"

          source build/envsetup.sh || true

          lunch twrp_tanzanite-eng

          mka vendorbootimage -j"$(nproc --all)"

      # ============================================================
      # 11. Show everything OrangeFox generated
      # ============================================================
      - name: Locate generated files
        working-directory: fox_12.1
        run: |
          set -eux

          echo "================================================"
          echo "ALL GENERATED RECOVERY ARTIFACTS"
          echo "================================================"

          find out/target/product/tanzanite \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.zip" \
              -o -name "*.cpio" \
              -o -name "*.cpio.lz4" \
              -o -name "*ramdisk*" \
            \) \
            -printf "%p %s bytes\n" \
            | sort

      # ============================================================
      # 12. Verify vendor_boot v4
      # ============================================================
      - name: Verify generated vendor_boot
        working-directory: fox_12.1
        run: |
          set -eux

          VENDOR_BOOT="out/target/product/tanzanite/vendor_boot.img"

          test -f "$VENDOR_BOOT"

          echo "Generated vendor_boot:"
          ls -lh "$VENDOR_BOOT"

          echo
          echo "Generated SHA256:"
          sha256sum "$VENDOR_BOOT"

          python3 - "$VENDOR_BOOT" <<'PY'
          import struct
          import sys

          path = sys.argv[1]

          with open(path, "rb") as f:
              data = f.read(4096)

          if data[:8] != b"VNDRBOOT":
              raise SystemExit(
                  "ERROR: Generated file is not vendor_boot"
              )

          version = struct.unpack_from("<I", data, 8)[0]
          page_size = struct.unpack_from("<I", data, 12)[0]
          vendor_ramdisk_size = struct.unpack_from("<I", data, 24)[0]
          header_size = struct.unpack_from("<I", data, 2096)[0]
          dtb_size = struct.unpack_from("<I", data, 2100)[0]
          table_size = struct.unpack_from("<I", data, 2112)[0]
          entry_num = struct.unpack_from("<I", data, 2116)[0]
          entry_size = struct.unpack_from("<I", data, 2120)[0]
          bootconfig_size = struct.unpack_from("<I", data, 2124)[0]

          print("magic              :", data[:8])
          print("header version     :", version)
          print("page size          :", page_size)
          print("vendor ramdisk     :", vendor_ramdisk_size)
          print("header size        :", header_size)
          print("dtb size           :", dtb_size)
          print("ramdisk table size :", table_size)
          print("ramdisk entries    :", entry_num)
          print("entry size         :", entry_size)
          print("bootconfig size    :", bootconfig_size)

          if version != 4:
              raise SystemExit(
                  "ERROR: vendor_boot is not header v4"
              )

          if page_size != 4096:
              raise SystemExit(
                  "ERROR: unexpected page size"
              )

          if header_size != 2128:
              raise SystemExit(
                  "ERROR: unexpected v4 header size"
              )

          if entry_size != 108:
              raise SystemExit(
                  "ERROR: unexpected vendor ramdisk entry size"
              )

          print()
          print("vendor_boot v4 verification PASSED")
          PY

      # ============================================================
      # 13. Prepare final artifact directory
      # ============================================================
      - name: Prepare final artifacts
        run: |
          set -eux

          rm -rf final
          mkdir -p final

      # ============================================================
      # 14. Find OrangeFox installer ZIP
      # ============================================================
      - name: Find installer ZIP
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eux

          echo "Searching for ZIP files..."

          mapfile -t ZIPS < <(
            find out \
              -type f \
              -iname "*.zip" \
              -size +1M \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "No ZIP found in build output."
            echo
            echo "This OrangeFox tree may not automatically"
            echo "generate an installer ZIP."
            exit 1
          fi

          echo
          echo "ZIP candidates:"
          printf '%s\n' "${ZIPS[@]}"

          SELECTED=""

          for z in "${ZIPS[@]}"; do

            if unzip -l "$z" \
              | grep -q "META-INF/com/google/android"; then

              SELECTED="$z"
              break
            fi

          done

          if [ -z "$SELECTED" ]; then
            echo
            echo "ERROR:"
            echo "ZIPs exist, but none contains the required"
            echo "Android installer META-INF structure."
            exit 1
          fi

          echo
          echo "Selected installer:"
          echo "$SELECTED"

          cp "$SELECTED" \
            "$GITHUB_WORKSPACE/final/OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM-installer.zip"

      # ============================================================
      # 15. Copy generated recovery artifacts
      # ============================================================
      - name: Collect recovery artifacts
        working-directory: fox_12.1
        shell: bash
        run: |
          set -eux

          FINAL="$GITHUB_WORKSPACE/final"

          VENDOR_BOOT="out/target/product/tanzanite/vendor_boot.img"

          test -f "$VENDOR_BOOT"

          cp "$VENDOR_BOOT" \
            "$FINAL/vendor_boot-built.img"

          if [ -f out/target/product/tanzanite/ramdisk.img ]; then
            cp \
              out/target/product/tanzanite/ramdisk.img \
              "$FINAL/ramdisk.img"
          fi

          # Collect recovery ramdisk artifacts.
          find out/target/product/tanzanite \
            -type f \
            \( \
              -name "vendor_ramdisk_recovery.cpio" \
              -o -name "vendor_ramdisk.cpio" \
              -o -name "vendor_ramdisk.cpio.lz4" \
            \) \
            -exec cp {} "$FINAL/" \;

          echo
          echo "FINAL ARTIFACTS:"
          find "$FINAL" \
            -maxdepth 1 \
            -type f \
            -printf "%f %s bytes\n" \
            | sort

      # ============================================================
      # 16. Inspect installer
      # ============================================================
      - name: Inspect installer
        run: |
          set -eux

          ZIP="$GITHUB_WORKSPACE/final/OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM-installer.zip"

          test -f "$ZIP"

          echo "================================================"
          echo "INSTALLER ZIP"
          echo "================================================"

          ls -lh "$ZIP"

          echo
          echo "================================================"
          echo "ZIP CONTENTS"
          echo "================================================"

          unzip -l "$ZIP"

          echo
          echo "================================================"
          echo "META-INF"
          echo "================================================"

          unzip -l "$ZIP" \
            | grep -E \
              'META-INF/com/google/android/(update-binary|updater-script)'

          echo
          echo "================================================"
          echo "RAMDISK"
          echo "================================================"

          unzip -l "$ZIP" \
            | grep -E \
              'vendor_ramdisk|ramdisk' \
            || true

      # ============================================================
      # 17. Generate checksums
      # ============================================================
      - name: Generate SHA256 checksums
        run: |
          set -eux

          cd final

          sha256sum * \
            | tee SHA256SUMS.txt

      # ============================================================
      # 18. Upload final artifact
      # ============================================================
      - name: Upload OrangeFox artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM
          path: final/
          if-no-files-found: error
          compression-level: 0
