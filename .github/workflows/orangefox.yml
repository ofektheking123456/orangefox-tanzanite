name: Build OrangeFox for Redmi Note 14 4G

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate vendor_boot recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex gperf git git-lfs \
            imagemagick lib32z1-dev libelf-dev liblz4-tool libncurses-dev \
            libssl-dev libxml2-utils lz4 python3 python3-pip rsync \
            squashfs-tools unzip wget xxd zip zlib1g-dev

      - name: Add swap
        shell: bash
        run: |
          set -euo pipefail
          sudo fallocate -l 16G /mnt/orangefox.swap
          sudo chmod 600 /mnt/orangefox.swap
          sudo mkswap /mnt/orangefox.swap
          sudo swapon /mnt/orangefox.swap
          free -h

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          sudo curl --fail --location https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo
          repo --version

      - name: Sync OrangeFox 12.1 sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git OrangeFox_sync
          chmod +x OrangeFox_sync/orangefox_sync.sh
          OrangeFox_sync/orangefox_sync.sh --branch 12.1 --path "$GITHUB_WORKSPACE/fox_12.1"

      - name: Add the Tanzanite recovery device tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch fox_12.1 \
            https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery.git \
            "$GITHUB_WORKSPACE/fox_12.1/device/xiaomi/tanzanite"

      - name: Verify the stock reference image
        shell: bash
        run: |
          set -euo pipefail
          stock="$GITHUB_WORKSPACE/stock/vendor_boot.img"
          test -f "$stock"
          test "$(stat -c%s "$stock")" = 67108864
          test "$(sha256sum "$stock" | awk '{print $1}')" = 9cbb1b2bc1278e46a5cb99b30925bc607d3ecea40e8e61ccf42f4c2dac225d26
          test "$(dd if="$stock" bs=1 count=8 status=none)" = VNDRBOOT

      - name: Build Tanzanite vendor_boot recovery
        working-directory: fox_12.1
        shell: bash
        run: |
          set -euo pipefail
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1
          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$GITHUB_WORKSPACE/stock/vendor_boot.img"
          export FOX_TARGET_DEVICES=tanzanite
          export FOX_PORTS_TMP="$GITHUB_WORKSPACE/fox_installer_tmp"
          mkdir -p "$FOX_PORTS_TMP"
          source build/envsetup.sh
          lunch twrp_tanzanite-eng
          mka vendorbootimage -j"$(nproc --all)"

      - name: Validate the generated recovery ramdisk
        working-directory: fox_12.1
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(find out/target/product/tanzanite -type f \( -name 'vendor_ramdisk_recovery.cpio' -o -name 'vendor_ramdisk_recovery.cpio.lz4' \) -print -quit)"
          test -n "$candidate" || { echo "No generated vendor_ramdisk_recovery CPIO was found."; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/validated"
          cp "$candidate" "$GITHUB_WORKSPACE/validated/$(basename "$candidate")"
          if [[ "$candidate" == *.lz4 ]]; then
            lz4 -d -f "$candidate" "$GITHUB_WORKSPACE/validated/recovery.cpio"
          else
            cp "$candidate" "$GITHUB_WORKSPACE/validated/recovery.cpio"
          fi
          cpio -it < "$GITHUB_WORKSPACE/validated/recovery.cpio" | tee "$GITHUB_WORKSPACE/validated/recovery-ramdisk-files.txt"
          for required in system/bin/recovery system/bin/fastbootd sbin/foxstart.sh system/etc/recovery.fstab; do
            grep -Fx "$required" "$GITHUB_WORKSPACE/validated/recovery-ramdisk-files.txt" >/dev/null || {
              echo "Required recovery path missing: $required"; exit 1;
            }
          done

      - name: Validate final vendor_boot candidate
        working-directory: fox_12.1
        shell: bash
        run: |
          set -euo pipefail
          image="out/target/product/tanzanite/vendor_boot.img"
          stock="$GITHUB_WORKSPACE/stock/vendor_boot.img"
          test -f "$image" || { echo "Generated vendor_boot.img is missing."; exit 1; }
          test "$(stat -c%s "$image")" = 67108864 || { echo "Generated vendor_boot has the wrong partition size."; exit 1; }
          test "$(dd if="$image" bs=1 count=8 status=none)" = VNDRBOOT || { echo "Generated image is not a vendor_boot image."; exit 1; }
          ! cmp -s "$image" "$stock" || { echo "Generated vendor_boot is byte-identical to stock; refusing to publish it."; exit 1; }
          cp "$image" "$GITHUB_WORKSPACE/validated/OrangeFox-vendor_boot-tanzanite.img"
          cp "$stock" "$GITHUB_WORKSPACE/validated/stock-vendor_boot.img"
          sha256sum "$GITHUB_WORKSPACE/validated/"*.img "$GITHUB_WORKSPACE/validated/recovery.cpio" > "$GITHUB_WORKSPACE/validated/SHA256SUMS"
          {
            echo "device=tanzanite"
            echo "model=Redmi Note 14 4G"
            echo "firmware=OS3.0.302.0.WOGMIXM"
            echo "stock_vendor_boot_sha256=$(sha256sum "$stock" | awk '{print $1}')"
            echo "candidate_vendor_boot_sha256=$(sha256sum "$image" | awk '{print $1}')"
          } > "$GITHUB_WORKSPACE/validated/build-metadata.txt"

      - name: Package validated diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/validated"
          zip -9 -r "$GITHUB_WORKSPACE/OrangeFox-tanzanite-validated.zip" .
          unzip -t "$GITHUB_WORKSPACE/OrangeFox-tanzanite-validated.zip"

      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-validated
          path: OrangeFox-tanzanite-validated.zip
          if-no-files-found: error
          retention-days: 14
