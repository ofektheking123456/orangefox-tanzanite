name: Build OrangeFox Tanzanite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Pull Git LFS files
        run: |
          set -e
          git lfs install
          git lfs pull

      # ============================================================
      # VERIFY STOCK VENDOR_BOOT
      # ============================================================
      - name: Verify stock vendor_boot
        run: |
          set -e

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          echo "===== STOCK VENDOR_BOOT ====="
          ls -lh "$STOCK"

          SIZE=$(stat -c%s "$STOCK")
          SHA=$(sha256sum "$STOCK" | awk '{print $1}')

          echo "Size: $SIZE"
          echo "SHA256: $SHA"

          if [ "$SIZE" != "67108864" ]; then
            echo "ERROR: vendor_boot.img is not 64 MiB"
            exit 1
          fi

          if [ "$SHA" != "9cbb1b2bc1278e46a5cb99b30925bc607d3ecea40e8e61ccf42f4c2dac225d26" ]; then
            echo "ERROR: stock vendor_boot SHA256 does not match"
            exit 1
          fi

          echo "Stock vendor_boot verified."

      # ============================================================
      # FIX UBUNTU APT / CHROME REPOSITORY
      # ============================================================
      - name: Fix APT repositories
        run: |
          set -e

          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources

          sudo rm -rf /var/lib/apt/lists/*
          sudo apt clean
          sudo apt update

      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        run: |
          set -e

          sudo apt install -y \
            git \
            git-lfs \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            bc \
            bison \
            build-essential \
            flex \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libncurses6 \
            libssl-dev \
            libxml2-utils \
            lz4 \
            pngcrush \
            python3 \
            python3-pip \
            rsync \
            squashfs-tools \
            xsltproc \
            zipalign \
            zlib1g-dev

      # ============================================================
      # SWAP
      # ============================================================
      - name: Create swap
        run: |
          set -e

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          free -h

      # ============================================================
      # INSTALL REPO TOOL
      # ============================================================
      - name: Install repo tool
        run: |
          set -e

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version

      # ============================================================
      # SYNC ORANGEFOX 12.1
      # ============================================================
      - name: Sync OrangeFox
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/fox_12.1"
          rm -rf "$GITHUB_WORKSPACE/OrangeFox_sync"

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            "$GITHUB_WORKSPACE/OrangeFox_sync"

          cd "$GITHUB_WORKSPACE/OrangeFox_sync"

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"

      # ============================================================
      # CLONE TANZANITE DEVICE TREE
      # ============================================================
      - name: Clone Tanzanite recovery tree
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/fox_12.1"

          rm -rf device/xiaomi/tanzanite

          git clone \
            --depth=1 \
            --branch fox_12.1 \
            https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery.git \
            device/xiaomi/tanzanite

          echo "===== TANZANITE TREE ====="
          find device/xiaomi/tanzanite -maxdepth 2 -type f | sort | head -200

      # ============================================================
      # CHECK STOCK IMAGE FROM GIT LFS
      # ============================================================
      - name: Check LFS checkout
        run: |
          set -e

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          echo "===== LFS CHECK ====="
          file "$STOCK"
          ls -lh "$STOCK"

          if [ "$(stat -c%s "$STOCK")" != "67108864" ]; then
            echo "ERROR: Git LFS file was not downloaded correctly."
            exit 1
          fi

      # ============================================================
      # BUILD ORANGEFOX
      # ============================================================
      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        TANZANITE ORANGEFOX BUILD"
          echo "=========================================="

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          # --------------------------------------------------------
          # OrangeFox vendor_boot recovery configuration
          # --------------------------------------------------------
          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          # Android 16 / vendor_boot v4
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1

          # Use the REAL STOCK Tanzanite vendor_boot as reference.
          # OrangeFox will replace the recovery ramdisk while
          # preserving the stock vendor_boot resources.
          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$STOCK"

          # Tanzanite
          export FOX_TARGET_DEVICES="tanzanite"

          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"
          echo "FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=$FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL"
          echo "FOX_REFERENCE_VENDOR_BOOT_IMAGE=$FOX_REFERENCE_VENDOR_BOOT_IMAGE"
          echo "FOX_TARGET_DEVICES=$FOX_TARGET_DEVICES"

          # --------------------------------------------------------
          # Environment
          # --------------------------------------------------------
          source build/envsetup.sh || true

          lunch twrp_tanzanite-eng

          echo "===== BUILD TARGET ====="
          get_build_var TARGET_DEVICE
          get_build_var TARGET_ARCH
          get_build_var BOARD_BOOT_HEADER_VERSION
          get_build_var BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT
          get_build_var BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE

          # --------------------------------------------------------
          # Build vendor_boot recovery
          # --------------------------------------------------------
          mka vendorbootimage -j"$(nproc --all)" 2>&1 | tee build.log

      # ============================================================
      # FIND ALL RECOVERY ARTIFACTS
      # ============================================================
      - name: Inspect build output
        working-directory: fox_12.1
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"

          echo "=========================================="
          echo "          BUILD OUTPUT FILES"
          echo "=========================================="

          find "$PRODUCT" \
            -type f \
            \( \
              -name '*OrangeFox*' \
              -o -name 'vendor_boot.img' \
              -o -name 'vendor_ramdisk*' \
              -o -name '*ramdisk*.cpio*' \
              -o -name 'ramdisk.img' \
            \) \
            -printf '%p %s bytes\n' \
            | sort

          echo ""
          echo "=========================================="
          echo "          ALL CPIO ARTIFACTS"
          echo "=========================================="

          find "$GITHUB_WORKSPACE/fox_12.1/out" \
            -type f \
            \( \
              -name '*.cpio' \
              -o -name '*.cpio.*' \
              -o -name '*vendor_ramdisk*' \
            \) \
            -printf '%p %s bytes\n' \
            | sort || true

      # ============================================================
      # VERIFY MAIN IMAGE
      # ============================================================
      - name: Verify OrangeFox image
        working-directory: fox_12.1
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"

          echo "===== ORANGEFOX IMAGES ====="

          find "$PRODUCT" \
            -maxdepth 1 \
            -type f \
            -iname '*OrangeFox*.img' \
            -print

          FOX_IMG=$(find "$PRODUCT" \
            -maxdepth 1 \
            -type f \
            -iname '*OrangeFox*.img' \
            | head -1)

          if [ -z "$FOX_IMG" ]; then
            echo "ERROR: OrangeFox image was not generated."
            exit 1
          fi

          echo ""
          echo "OrangeFox image:"
          ls -lh "$FOX_IMG"

          echo ""
          echo "File:"
          file "$FOX_IMG"

          echo ""
          echo "SHA256:"
          sha256sum "$FOX_IMG"

          echo ""
          echo "First 64 bytes:"
          xxd -l 64 "$FOX_IMG"

      # ============================================================
      # VERIFY VENDOR_BOOT OUTPUT
      # ============================================================
      - name: Verify vendor_boot output
        working-directory: fox_12.1
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"

          if [ ! -f "$PRODUCT/vendor_boot.img" ]; then
            echo "ERROR: vendor_boot.img was not generated."
            exit 1
          fi

          echo "===== GENERATED VENDOR_BOOT ====="

          ls -lh "$PRODUCT/vendor_boot.img"

          echo ""
          file "$PRODUCT/vendor_boot.img"

          echo ""
          sha256sum "$PRODUCT/vendor_boot.img"

          echo ""
          echo "Header:"
          xxd -l 64 "$PRODUCT/vendor_boot.img"

          SIZE=$(stat -c%s "$PRODUCT/vendor_boot.img")

          if [ "$SIZE" != "67108864" ]; then
            echo "ERROR: Generated vendor_boot is not 64 MiB."
            exit 1
          fi

      # ============================================================
      # SEARCH FOR VENDOR RAMDISK
      # ============================================================
      - name: Locate vendor ramdisk
        working-directory: fox_12.1
        run: |
          set -e

          OUT="$GITHUB_WORKSPACE/fox_12.1/out"

          echo "=========================================="
          echo "       SEARCHING ENTIRE OUT DIRECTORY"
          echo "=========================================="

          find "$OUT" \
            -type f \
            \( \
              -iname '*vendor_ramdisk*' \
              -o -iname '*recovery*.cpio*' \
              -o -iname '*.cpio' \
              -o -iname '*.cpio.lz4' \
            \) \
            -printf '%p\n' \
            | sort \
            | tee "$GITHUB_WORKSPACE/vendor_ramdisk_paths.txt"

          echo ""
          echo "===== RAMDISK PATH COUNT ====="

          COUNT=$(wc -l < "$GITHUB_WORKSPACE/vendor_ramdisk_paths.txt")

          echo "Found: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "WARNING: No separate CPIO ramdisk artifact found."
            echo "The generated vendor_boot.img is still preserved for inspection."
          fi

      # ============================================================
      # CREATE ARTIFACT DIRECTORY
      # ============================================================
      - name: Package recovery artifacts
        working-directory: fox_12.1
        run: |
          set -e

          PRODUCT="$GITHUB_WORKSPACE/fox_12.1/out/target/product/tanzanite"
          ARTIFACT="$GITHUB_WORKSPACE/OrangeFox-Tanzanite-OS3.0.302.0-WOGMIXM"

          rm -rf "$ARTIFACT"
          mkdir -p "$ARTIFACT"

          # Main generated files
          find "$PRODUCT" \
            -maxdepth 1 \
            -type f \
            -iname '*OrangeFox*.img' \
            -exec cp -v {} "$ARTIFACT/" \;

          cp -v "$PRODUCT/vendor_boot.img" "$ARTIFACT/"
          cp -v "$PRODUCT/ramdisk.img" "$ARTIFACT/" 2>/dev/null || true

          # Copy every vendor ramdisk artifact found anywhere
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            NAME=$(basename "$FILE")

            echo "Copying: $FILE"

            cp -v "$FILE" "$ARTIFACT/$NAME"

          done < "$GITHUB_WORKSPACE/vendor_ramdisk_paths.txt"

          # Build log
          cp -v "$GITHUB_WORKSPACE/fox_12.1/build.log" \
            "$ARTIFACT/" 2>/dev/null || true

          # Search result
          cp -v "$GITHUB_WORKSPACE/vendor_ramdisk_paths.txt" \
            "$ARTIFACT/"

          echo ""
          echo "=========================================="
          echo "          FINAL ARTIFACTS"
          echo "=========================================="

          find "$ARTIFACT" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

      # ============================================================
      # CREATE ZIP
      # ============================================================
      - name: Create final ZIP
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          zip -r \
            "OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip" \
            "OrangeFox-Tanzanite-OS3.0.302.0-WOGMIXM"

          echo ""
          echo "===== FINAL ZIP ====="
          ls -lh \
            "OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip"

      # ============================================================
      # UPLOAD EVERYTHING
      # ============================================================
      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM
          path: |
            OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip
            OrangeFox-Tanzanite-OS3.0.302.0-WOGMIXM/
          if-no-files-found: error
          compression-level: 0
