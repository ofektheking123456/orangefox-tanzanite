name: OrangeFox Recovery - Redmi Note 14 4G

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5-dev \
            x11proto-core-dev libx11-dev libreadline-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip \
            python3 python3-pip bc cpio rsync lz4 \
            libssl-dev libelf-dev

      - name: Create swap
        run: |
          set -e

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo "===== SWAP ====="
          swapon --show
          free -h

      - name: Install repo tool
        run: |
          set -e

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version

      - name: Sync OrangeFox
        run: |
          set -e

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            fox_sync

          cd fox_sync

          bash orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"

      - name: Clone Tanzanite recovery tree
        run: |
          set -e

          mkdir -p fox_12.1/device/xiaomi

          git clone --depth=1 \
            -b fox_12.1 \
            https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery.git \
            fox_12.1/device/xiaomi/tanzanite

      - name: Verify device tree
        run: |
          set -e

          test -f fox_12.1/device/xiaomi/tanzanite/fox_tanzanite.mk
          test -f fox_12.1/device/xiaomi/tanzanite/twrp_tanzanite.mk
          test -f fox_12.1/device/xiaomi/tanzanite/BoardConfig.mk
          test -f fox_12.1/device/xiaomi/tanzanite/prebuilt/dtb

          echo "======================================"
          echo "Tanzanite device tree: OK"
          echo "======================================"

      - name: Show device configuration
        run: |
          echo "===== BoardConfig ====="
          grep -E \
            'BOARD_BOOT_HEADER_VERSION|BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE|BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT|BOARD_EXCLUDE_KERNEL_FROM_RECOVERY_IMAGE|BOARD_USES_GENERIC_KERNEL_IMAGE' \
            fox_12.1/device/xiaomi/tanzanite/BoardConfig.mk || true

          echo "===== Product files ====="
          ls -lah fox_12.1/device/xiaomi/tanzanite/

      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Loading OrangeFox environment"
          echo "======================================"

          source build/envsetup.sh || true

          echo "======================================"
          echo "Selecting Tanzanite"
          echo "======================================"

          lunch twrp_tanzanite-eng

          echo "======================================"
          echo "Building vendor_boot OrangeFox"
          echo "======================================"

          mka vendorbootimage -j"$(nproc --all)"

          echo "======================================"
          echo "BUILD FINISHED"
          echo "======================================"

      - name: Inspect build output
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "PRODUCT OUTPUT"
          echo "======================================"

          OUT="fox_12.1/out/target/product/tanzanite"

          if [ -d "$OUT" ]; then
            ls -lah "$OUT"

            echo ""
            echo "===== ALL IMG FILES ====="

            find "$OUT" \
              -type f \
              -name "*.img" \
              -printf '%p (%s bytes)\n' \
              2>/dev/null || true
          else
            echo "Product output directory does not exist."
          fi

      - name: Collect images
        shell: bash
        run: |
          set -e

          OUT="fox_12.1/out/target/product/tanzanite"

          mkdir -p release

          echo "======================================"
          echo "COLLECTING IMAGES"
          echo "======================================"

          find "$OUT" \
            -type f \
            -name "*.img" \
            -exec cp {} release/ \;

          echo ""
          echo "===== RELEASE CONTENTS ====="

          ls -lah release

          if ! find release \
            -type f \
            -name "*.img" \
            -print \
            -quit | grep -q .; then

            echo ""
            echo "ERROR: No IMG files were produced."
            exit 1
          fi

      - name: Create OrangeFox ZIP
        shell: bash
        run: |
          set -e

          cd release

          ZIP_NAME="OrangeFox-tanzanite-${GITHUB_RUN_NUMBER}.zip"

          zip -9 "../${ZIP_NAME}" ./*.img

          cd ..

          echo "======================================"
          echo "FINAL ZIP"
          echo "======================================"

          ls -lh "${ZIP_NAME}"

      - name: Upload OrangeFox ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-${{ github.run_number }}
          path: OrangeFox-tanzanite-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orangefox-tanzanite-${{ github.run_number }}
          name: OrangeFox Tanzanite Build ${{ github.run_number }}
          generate_release_notes: true
          files: OrangeFox-tanzanite-${{ github.run_number }}.zip
