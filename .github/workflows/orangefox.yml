name: Build OrangeFox Tanzanite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Pull Git LFS files
        run: |
          set -e
          git lfs install
          git lfs pull

      - name: Remove problematic Google Chrome APT repository
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt clean
          sudo apt update

      - name: Install build dependencies
        run: |
          set -e

          sudo apt install -y \
            git \
            git-lfs \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            bc \
            bison \
            build-essential \
            flex \
            gperf \
            imagemagick \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libncurses6 \
            libssl-dev \
            libxml2-utils \
            lz4 \
            pngcrush \
            python3 \
            python3-pip \
            squashfs-tools \
            xsltproc \
            zipalign \
            zlib1g-dev

      - name: Create swap
        run: |
          set -e

          SWAPFILE=/tmp/orangefox.swap

          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"

          sudo fallocate -l 16G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          free -h

      - name: Install repo tool
        run: |
          set -e

          sudo curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod +x /usr/local/bin/repo

          repo --version

      - name: Sync OrangeFox source
        run: |
          set -e

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            OrangeFox_sync

          cd OrangeFox_sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$GITHUB_WORKSPACE/fox_12.1"

      - name: Clone Tanzanite recovery tree
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch fox_12.1 \
            https://github.com/DVWorkspaces/device_xiaomi_tanzanite_recovery.git \
            "$GITHUB_WORKSPACE/fox_12.1/device/xiaomi/tanzanite"

      - name: Verify stock vendor_boot
        run: |
          set -e

          STOCK="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          echo "Checking stock vendor_boot..."

          test -f "$STOCK"

          SIZE=$(stat -c%s "$STOCK")
          SHA=$(sha256sum "$STOCK" | awk '{print $1}')

          echo "Stock size: $SIZE"
          echo "Stock SHA256: $SHA"

          if [ "$SIZE" -ne 67108864 ]; then
            echo "ERROR: stock vendor_boot.img is not 64 MiB"
            exit 1
          fi

          if [ "$SHA" != "9cbb1b2bc1278e46a5cb99b30925bc607d3ecea40e8e61ccf42f4c2dac225d26" ]; then
            echo "ERROR: stock vendor_boot.img SHA256 does not match"
            exit 1
          fi

          echo "Stock vendor_boot verified."

      - name: Build OrangeFox
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$GITHUB_WORKSPACE/stock/vendor_boot.img"

          export FOX_TARGET_DEVICES=tanzanite

          echo "FOX_VENDOR_BOOT_RECOVERY=$FOX_VENDOR_BOOT_RECOVERY"
          echo "FOX_AB_DEVICE=$FOX_AB_DEVICE"
          echo "FOX_VIRTUAL_AB_DEVICE=$FOX_VIRTUAL_AB_DEVICE"
          echo "FOX_REFERENCE_VENDOR_BOOT_IMAGE=$FOX_REFERENCE_VENDOR_BOOT_IMAGE"

          source build/envsetup.sh || true

          lunch twrp_tanzanite-eng

          echo "Starting vendor_boot build..."

          mka vendorbootimage -j"$(nproc --all)"

      - name: Inspect OrangeFox output
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          echo "===== Searching out directory ====="

          find out -type f \
            \( \
              -name "*.img" \
              -o -name "*.cpio" \
              -o -name "*.cpio.lz4" \
              -o -name "vendor_ramdisk*" \
              -o -name "ramdisk*" \
            \) \
            -printf "%p %s bytes\n" \
            | sort

          echo
          echo "===== Searching for vendor ramdisk artifacts ====="

          find out -type f \
            \( \
              -iname "*vendor*ramdisk*" \
              -o -iname "*ramdisk*.cpio*" \
            \) \
            -print \
            | sort || true

      - name: Verify OrangeFox image
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          FOX_IMG=$(find out -type f \
            -name "OrangeFox-*.img" \
            -size 64M \
            | head -n 1)

          if [ -z "$FOX_IMG" ]; then
            echo "ERROR: OrangeFox 64 MiB image not found"
            exit 1
          fi

          echo "OrangeFox image:"
          echo "$FOX_IMG"

          ls -lh "$FOX_IMG"

          echo
          echo "First 64 bytes:"
          xxd -l 64 "$FOX_IMG"

          MAGIC=$(dd if="$FOX_IMG" bs=1 count=8 2>/dev/null)

          if [ "$MAGIC" != "VNDRBOOT" ]; then
            echo "ERROR: Output does not start with VNDRBOOT"
            exit 1
          fi

          echo "OrangeFox vendor_boot image verified."

      - name: Find generated vendor_boot image
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          echo "===== Looking for vendor_boot.img ====="

          find out -type f \
            -name "vendor_boot.img" \
            -printf "%p %s bytes\n" \
            | sort

          VENDOR_BOOT=$(find out -type f \
            -name "vendor_boot.img" \
            -size 64M \
            | head -n 1)

          if [ -z "$VENDOR_BOOT" ]; then
            echo "ERROR: 64 MiB vendor_boot.img not found"
            exit 1
          fi

          echo "Using:"
          echo "$VENDOR_BOOT"

          ls -lh "$VENDOR_BOOT"

      - name: Collect all recovery artifacts
        working-directory: fox_12.1
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/vendor_ramdisk"

          FOX_IMG=$(find out -type f \
            -name "OrangeFox-*.img" \
            -size 64M \
            | head -n 1)

          VENDOR_BOOT=$(find out -type f \
            -name "vendor_boot.img" \
            -size 64M \
            | head -n 1)

          RAMDISK=$(find out -type f \
            -name "ramdisk.img" \
            | head -n 1)

          if [ -n "$FOX_IMG" ]; then
            cp "$FOX_IMG" \
              "$GITHUB_WORKSPACE/artifacts/OrangeFox-R12.0-tanzanite.img"
          fi

          if [ -n "$VENDOR_BOOT" ]; then
            cp "$VENDOR_BOOT" \
              "$GITHUB_WORKSPACE/artifacts/vendor_boot.img"
          fi

          if [ -n "$RAMDISK" ]; then
            cp "$RAMDISK" \
              "$GITHUB_WORKSPACE/artifacts/ramdisk.img"
          fi

          echo "===== Searching ALL vendor ramdisk files ====="

          find out -type f \
            \( \
              -iname "*vendor*ramdisk*" \
              -o -iname "*ramdisk*.cpio*" \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do
            echo "Found: $FILE"

            BASENAME=$(basename "$FILE")

            cp "$FILE" \
              "$GITHUB_WORKSPACE/artifacts/vendor_ramdisk/$BASENAME"
          done

          echo
          echo "===== Final artifacts ====="

          find "$GITHUB_WORKSPACE/artifacts" \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

      - name: Inspect vendor ramdisk archives
        shell: bash
        run: |
          set -e

          DIR="$GITHUB_WORKSPACE/artifacts/vendor_ramdisk"

          if [ ! -d "$DIR" ]; then
            exit 0
          fi

          echo "===== Vendor ramdisk files ====="

          find "$DIR" -type f -printf "%f %s bytes\n"

          for FILE in "$DIR"/*; do
            [ -f "$FILE" ] || continue

            echo
            echo "===== $FILE ====="

            file "$FILE" || true

            case "$FILE" in
              *.lz4)
                echo "Attempting LZ4 decompression..."

                lz4 -d -f "$FILE" "${FILE%.lz4}.cpio" || true
                ;;
            esac
          done

      - name: Create artifact ZIP
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/artifacts"

          echo "===== Files before ZIP ====="

          find . -type f \
            -printf "%p %s bytes\n" \
            | sort

          zip -r \
            "$GITHUB_WORKSPACE/OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip" \
            .

      - name: Show final ZIP
        run: |
          set -e

          ls -lh \
            "$GITHUB_WORKSPACE/OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip"

          echo
          echo "===== ZIP contents ====="

          unzip -l \
            "$GITHUB_WORKSPACE/OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip"

      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM
          path: |
            OrangeFox-tanzanite-OS3.0.302.0-WOGMIXM.zip
            artifacts/
          if-no-files-found: error
