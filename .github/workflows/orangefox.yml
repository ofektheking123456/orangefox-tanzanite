name: Build OrangeFox Tanzanite

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FOX_BRANCH: 12.1
  DEVICE: tanzanite
  TARGET_ANDROID_VERSION: "16"
  TARGET_FIRMWARE: OS3.0.303.0.WOGMIXM
  STOCK_VENDOR_BOOT_SHA256: be4cb87eb8ba382bc4073d31638d66497f9d993624e13c9f7ffc33b8ad5a8bd0
  STOCK_VENDOR_BOOT_SIZE: 67108864

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex gperf git git-lfs \
            imagemagick lib32z1-dev libelf-dev liblz4-tool libncurses-dev \
            libncurses6 libssl-dev libxml2-utils lz4 pngcrush \
            cpio python3 python3-pip rsync squashfs-tools unzip wget xsltproc \
            zip zipalign zlib1g-dev

      - name: Create swap
        shell: bash
        run: |
          set -euo pipefail
          swapfile=/tmp/orangefox.swap
          if ! sudo swapon --show=NAME | grep -Fxq "$swapfile"; then
            sudo swapoff "$swapfile" 2>/dev/null || true
            sudo rm -f "$swapfile"
            sudo fallocate -l 16G "$swapfile"
            sudo chmod 600 "$swapfile"
            sudo mkswap "$swapfile"
            sudo swapon "$swapfile"
          fi
          free -h

      - name: Verify stock vendor_boot
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
          image=stock/vendor_boot.img
          test -f "$image"
          test "$(stat -c%s "$image")" -eq "$STOCK_VENDOR_BOOT_SIZE"
          stock_sha256="$(sha256sum "$image" | cut -d' ' -f1)"
          test "$STOCK_VENDOR_BOOT_SHA256" != "REPLACE_WITH_OS3.0.303.0_VENDOR_BOOT_SHA256" || {
            echo "::error::Set STOCK_VENDOR_BOOT_SHA256 after adding the OS3.0.303.0.WOGMIXM stock image"
            exit 1
          }
          test "$stock_sha256" = "$STOCK_VENDOR_BOOT_SHA256"
          test "$stock_sha256" != "9cbb1b2bc1278e46a5cb99b30925bc607d3ecea40e8e61ccf42f4c2dac225d26" || {
            echo "::error::The repository still contains the old OS3.0.302.0.WOGMIXM vendor_boot reference"
            exit 1
          }
          test "$(dd if="$image" bs=1 count=8 2>/dev/null)" = "VNDRBOOT"

      - name: Verify Tanzanite device tree
        shell: bash
        run: |
          set -euo pipefail
          tree="device/xiaomi/$DEVICE"
          for file in AndroidProducts.mk BoardConfig.mk device.mk \
            twrp_tanzanite.mk vendorsetup.sh prebuilt/dtb \
            recovery/root/system/etc/recovery.fstab; do
            test -f "$tree/$file" || {
              echo "::error::$tree/$file is missing"
              exit 1
            }
          done

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            | sudo tee /usr/local/bin/repo >/dev/null
          sudo chmod 0755 /usr/local/bin/repo
          repo --version

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git OrangeFox_sync
          chmod +x OrangeFox_sync/orangefox_sync.sh
          (
            cd OrangeFox_sync
            ./orangefox_sync.sh \
              --branch "$FOX_BRANCH" \
              --path "$GITHUB_WORKSPACE/fox_12.1"
          )
          test -f "$GITHUB_WORKSPACE/fox_12.1/build/envsetup.sh"

      - name: Add Tanzanite device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fox_12.1/device/xiaomi
          rsync -a --delete device/xiaomi/tanzanite/ \
            fox_12.1/device/xiaomi/tanzanite/
          grep -qxF 'BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT := true' \
            fox_12.1/device/xiaomi/tanzanite/BoardConfig.mk || \
            printf '\nBOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT := true\n' \
              >> fox_12.1/device/xiaomi/tanzanite/BoardConfig.mk

      - name: Build vendor_boot recovery image
        working-directory: fox_12.1
        shell: bash
        run: |
          set -euo pipefail
          export TOP="$GITHUB_WORKSPACE/fox_12.1"

          set +e
          set +u
          source "$TOP/build/envsetup.sh"
          envsetup_status=$?
          set -e
          echo "OrangeFox envsetup exit status: $envsetup_status"

          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1
          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$GITHUB_WORKSPACE/stock/vendor_boot.img"
          export FOX_TARGET_DEVICES="$DEVICE"
          export FOX_PORTS_TMP="$GITHUB_WORKSPACE/fox_installer_tmp"
          lunch "twrp_${DEVICE}-eng"
          set -u

          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_VENDOR_BOOT_RECOVERY=1
          export FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL=1
          export FOX_REFERENCE_VENDOR_BOOT_IMAGE="$GITHUB_WORKSPACE/stock/vendor_boot.img"
          export FOX_TARGET_DEVICES="$DEVICE"
          export FOX_PORTS_TMP="$GITHUB_WORKSPACE/fox_installer_tmp"
          mkdir -p "$FOX_PORTS_TMP"

          build_log="$TOP/out/target/product/$DEVICE/vendorbootimage-build.log"
          set +e
          mka vendorbootimage -j"$(nproc --all)" 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo "::warning::Standard vendor_boot mkbootimg failed; see vendorbootimage-build.log and assemble a recovery-only vendor_boot v4 image"
            fragment="$TOP/out/target/product/$DEVICE/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.lz4"
            image="$TOP/out/target/product/$DEVICE/vendor_boot.img"
            mkbootimg="$TOP/out/host/linux-x86/bin/mkbootimg"
            avbtool="$TOP/out/host/linux-x86/bin/avbtool"
            stock="$GITHUB_WORKSPACE/stock/vendor_boot.img"
            stock_dtb="$RUNNER_TEMP/stock-vendor.dtb"
            stock_bootconfig="$RUNNER_TEMP/stock-bootconfig"
            stock_cmdline="$RUNNER_TEMP/stock-vendor-cmdline"
            python3 - "$stock" "$stock_dtb" "$stock_bootconfig" "$stock_cmdline" <<'PY'
          import struct
          import sys

          image, dtb_path, bootconfig_path, cmdline_path = sys.argv[1:]
          data = open(image, "rb").read()
          u32 = lambda off: struct.unpack_from("<I", data, off)[0]
          align = lambda value, size: (value + size - 1) // size * size
          page = u32(12)
          header = u32(2096)
          ramdisk_size = u32(24)
          dtb_size = u32(2100)
          table_size = u32(2112)
          dtb_offset = align(header, page) + align(ramdisk_size, page)
          table_offset = dtb_offset + align(dtb_size, page)
          bootconfig_offset = align(table_offset + table_size, page)
          open(dtb_path, "wb").write(data[dtb_offset:dtb_offset + dtb_size])
          open(bootconfig_path, "wb").write(
              data[bootconfig_offset:bootconfig_offset + u32(2124)]
          )
          cmdline = data[28:2076].split(b"\0", 1)[0].decode("ascii")
          open(cmdline_path, "w").write(cmdline)
          PY
            test -f "$fragment"
            "$mkbootimg" \
              --dtb "$stock_dtb" \
              --vendor_cmdline "$(cat "$stock_cmdline")" \
              --pagesize 4096 \
              --board "" \
              --kernel_offset 0x00008000 \
              --ramdisk_offset 0x26f08000 \
              --tags_offset 0x07c88000 \
              --header_version 4 \
              --dtb_offset 0x07c88000 \
              --ramdisk_type RECOVERY \
              --ramdisk_name recovery \
              --vendor_ramdisk_fragment "$fragment" \
              --vendor_bootconfig "$stock_bootconfig" \
              --vendor_boot "$image"
            "$avbtool" add_hash_footer \
              --image "$image" \
              --partition_size "$STOCK_VENDOR_BOOT_SIZE" \
              --partition_name vendor_boot \
              --prop "com.android.build.vendor_boot.fingerprint:$(cat "$TOP/out/target/product/$DEVICE/build_fingerprint.txt")"
          fi
          test -f "$TOP/out/target/product/$DEVICE/vendor_boot.img"

      - name: Inspect generated recovery ramdisk
        working-directory: fox_12.1
        shell: bash
        run: |
          set -euo pipefail

          product="out/target/product/$DEVICE"
          top="$GITHUB_WORKSPACE/fox_12.1"
          work="$RUNNER_TEMP/tanzanite-recovery-ramdisk"
          mkdir -p "$work"

          ramdisk=""
          for candidate in \
            "$product/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio" \
            "$product/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.lz4" \
            "$product/vendor_ramdisk_recovery.cpio" \
            "$product/vendor_ramdisk_recovery.cpio.lz4" \
            "$product/vendor_ramdisk.cpio" \
            "$product/vendor_ramdisk.cpio.lz4" \
            "$product/obj/PACKAGING/vendor_boot_intermediates/vendor_ramdisk_recovery.cpio" \
            "$product/obj/PACKAGING/vendor_boot_intermediates/vendor_ramdisk_recovery.cpio.lz4" \
            "$product/obj/PACKAGING/vendor_boot_intermediates/vendor_ramdisk.cpio" \
            "$product/obj/PACKAGING/vendor_boot_intermediates/vendor_ramdisk.cpio.lz4"; do
            if [ -f "$candidate" ]; then
              ramdisk="$candidate"
              break
            fi
          done

          if [ -z "$ramdisk" ]; then
            echo "::error::OrangeFox recovery vendor ramdisk CPIO was not produced"
            find "$product" -type f \
              \( -iname '*vendor*ramdisk*' -o -iname '*.cpio*' \) -print
            exit 1
          fi

          case "$ramdisk" in
            *.lz4)
              cpio="$work/vendor_ramdisk_recovery.cpio"
              lz4 -d -f "$ramdisk" "$cpio"
              ;;
            *)
              cpio="$ramdisk"
              ;;
          esac

          listing="$work/ramdisk.list"
          cpio -it < "$cpio" > "$work/ramdisk.raw.list" || true
          sed 's#^\./##' "$work/ramdisk.raw.list" > "$listing"
          for required in \
            system/bin/recovery \
            system/bin/fastbootd \
            sbin/foxstart.sh \
            system/etc/recovery.fstab \
            system/etc/fox.cfg; do
            grep -Fxq "$required" "$listing" || {
              echo "::error::Generated recovery ramdisk is missing $required"
              exit 1
            }
          done

          image="$product/vendor_boot.img"
          test -f "$image" || {
            echo "::error::OrangeFox vendor_boot.img was not produced"
            exit 1
          }
          test "$(stat -c%s "$image")" -eq "$STOCK_VENDOR_BOOT_SIZE"
          test "$(dd if="$image" bs=1 count=8 2>/dev/null)" = "VNDRBOOT"
          image_sha256="$(sha256sum "$image" | cut -d' ' -f1)"
          test "$image_sha256" != "$STOCK_VENDOR_BOOT_SHA256"
          avbtool="$top/out/host/linux-x86/bin/avbtool"
          "$avbtool" info_image --image "$image" > "$work/generated-avb-info.txt"
          "$avbtool" info_image --image "$GITHUB_WORKSPACE/stock/vendor_boot.img" \
            > "$work/stock-avb-info.txt"
          grep -Fq "Partition Size: $STOCK_VENDOR_BOOT_SIZE" \
            "$work/generated-avb-info.txt"
          grep -Fq "Partition Size: $STOCK_VENDOR_BOOT_SIZE" \
            "$work/stock-avb-info.txt"

          table="$work/vendor_boot_table.txt"
          python3 - "$image" "$work/final_recovery.ramdisk" "$table" <<'PY'
          import struct
          import sys

          image_path, recovery_path, table_path = sys.argv[1:]
          data = open(image_path, "rb").read()
          u32 = lambda off: struct.unpack_from("<I", data, off)[0]
          align = lambda value, size: (value + size - 1) // size * size

          if data[:8] != b"VNDRBOOT":
              raise SystemExit("invalid vendor_boot magic")
          header_version = u32(8)
          page_size = u32(12)
          vendor_ramdisk_size = u32(24)
          header_size = u32(2096)
          dtb_size = u32(2100)
          if header_version != 4:
              raise SystemExit(f"expected vendor_boot header version 4, got {header_version}")
          if page_size == 0 or header_size == 0:
              raise SystemExit("invalid vendor_boot page/header size")

          table_size = u32(2112)
          entry_count = u32(2116)
          entry_size = u32(2120)
          bootconfig_size = u32(2124)
          if entry_size != 108:
              raise SystemExit(f"unexpected ramdisk table entry size {entry_size}")
          if table_size != entry_count * entry_size:
              raise SystemExit("ramdisk table size does not match entry count")

          ramdisk_offset = align(header_size, page_size)
          table_offset = (
              ramdisk_offset
              + align(vendor_ramdisk_size, page_size)
              + align(dtb_size, page_size)
          )
          if table_offset + table_size > len(data):
              raise SystemExit("vendor ramdisk table exceeds image")

          recovery = None
          lines = [
              f"header_version={header_version}",
              f"page_size={page_size}",
              f"vendor_ramdisk_size={vendor_ramdisk_size}",
              f"header_size={header_size}",
              f"dtb_size={dtb_size}",
              f"table_offset={table_offset}",
              f"table_size={table_size}",
              f"entry_count={entry_count}",
              f"entry_size={entry_size}",
              f"bootconfig_size={bootconfig_size}",
          ]
          for index in range(entry_count):
              off = table_offset + index * entry_size
              size, rel_offset, ramdisk_type = struct.unpack_from("<III", data, off)
              name = data[off + 12:off + 44].split(b"\0", 1)[0].decode("ascii", "replace")
              entry = {
                  "index": index,
                  "size": size,
                  "offset": rel_offset,
                  "type": ramdisk_type,
                  "name": name,
              }
              lines.append(
                  f"entry[{index}].size={size} offset={rel_offset} "
                  f"type={ramdisk_type} name={name!r}"
              )
              if ramdisk_type == 2:
                  if recovery is not None:
                      raise SystemExit("multiple recovery ramdisk entries found")
                  recovery = entry

          open(table_path, "w").write("\n".join(lines) + "\n")
          if recovery is None:
              print("\n".join(lines), file=sys.stderr)
              raise SystemExit("no RECOVERY ramdisk entry (type 2) found")
          start = ramdisk_offset + recovery["offset"]
          end = start + recovery["size"]
          if start < ramdisk_offset or end > ramdisk_offset + vendor_ramdisk_size:
              raise SystemExit("recovery ramdisk entry exceeds vendor ramdisk")
          open(recovery_path, "wb").write(data[start:end])
          lines.append(f"recovery_entry_index={recovery['index']}")
          open(table_path, "w").write("\n".join(lines) + "\n")
          PY

          final_ramdisk="$work/final_recovery.ramdisk"
          final_cpio="$work/final_recovery.cpio"
          if lz4 -d -f "$final_ramdisk" "$final_cpio" 2>/dev/null; then
            :
          else
            cp "$final_ramdisk" "$final_cpio"
          fi
          final_listing="$work/final_ramdisk.list"
          cpio -it < "$final_cpio" > "$work/final_ramdisk.raw.list" || true
          sed 's#^\./##' "$work/final_ramdisk.raw.list" > "$final_listing"
          for required in \
            system/bin/recovery \
            system/bin/fastbootd \
            sbin/foxstart.sh \
            system/etc/recovery.fstab \
            system/etc/fox.cfg; do
            grep -Fxq "$required" "$final_listing" || {
              echo "::error::Final vendor_boot recovery ramdisk is missing $required"
              exit 1
            }
          done
          cmp -s "$cpio" "$final_cpio" || {
            echo "::error::Recovery ramdisk extracted from final vendor_boot differs from build output"
            exit 1
          }
          python3 - "$image" "$GITHUB_WORKSPACE/stock/vendor_boot.img" \
            "$work/layout-check.txt" <<'PY'
          import struct
          import sys

          generated, stock, report = sys.argv[1:]
          def sections(path):
              data = open(path, "rb").read()
              u32 = lambda off: struct.unpack_from("<I", data, off)[0]
              align = lambda value, size: (value + size - 1) // size * size
              page = u32(12)
              header = u32(2096)
              ramdisk_size = u32(24)
              dtb_size = u32(2100)
              table_size = u32(2112)
              bootconfig_size = u32(2124)
              ramdisk_offset = align(header, page)
              dtb_offset = ramdisk_offset + align(ramdisk_size, page)
              table_offset = dtb_offset + align(dtb_size, page)
              bootconfig_offset = align(table_offset + table_size, page)
              return {
                  "header_version": u32(8),
                  "page_size": page,
                  "dtb": data[dtb_offset:dtb_offset + dtb_size],
                  "bootconfig": data[bootconfig_offset:bootconfig_offset + bootconfig_size],
                  "dtb_size": dtb_size,
                  "bootconfig_size": bootconfig_size,
              }
          new, old = sections(generated), sections(stock)
          if new["header_version"] != 4 or old["header_version"] != 4:
              raise SystemExit("vendor_boot header version mismatch")
          if new["page_size"] != old["page_size"]:
              raise SystemExit("vendor_boot page size differs from stock")
          if new["dtb"] != old["dtb"]:
              raise SystemExit("generated DTB differs from stock vendor_boot DTB")
          if new["bootconfig"] != old["bootconfig"]:
              raise SystemExit("generated bootconfig differs from stock vendor_boot bootconfig")
          open(report, "w").write(
              f"stock_dtb_size={old['dtb_size']}\n"
              f"generated_dtb_size={new['dtb_size']}\n"
              f"stock_bootconfig_size={old['bootconfig_size']}\n"
              f"generated_bootconfig_size={new['bootconfig_size']}\n"
              "dtb_matches_stock=true\nbootconfig_matches_stock=true\n"
          )
          PY
          if cmp -s "$image" "$GITHUB_WORKSPACE/stock/vendor_boot.img"; then
            echo "::error::Generated vendor_boot.img is byte-identical to the stock reference"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$cpio" "$GITHUB_WORKSPACE/artifacts/vendor_ramdisk_recovery.cpio"
          cp "$final_cpio" "$GITHUB_WORKSPACE/artifacts/final_vendor_ramdisk_recovery.cpio"
          cp "$table" "$GITHUB_WORKSPACE/artifacts/vendor_boot_v4_table.txt"
          cp "$product/vendorbootimage-build.log" \
            "$GITHUB_WORKSPACE/artifacts/vendorbootimage-build.log"
          cp "$work/generated-avb-info.txt" "$GITHUB_WORKSPACE/artifacts/generated-avb-info.txt"
          cp "$work/stock-avb-info.txt" "$GITHUB_WORKSPACE/artifacts/stock-avb-info.txt"
          cp "$work/layout-check.txt" "$GITHUB_WORKSPACE/artifacts/layout-check.txt"
          cp "$image" "$GITHUB_WORKSPACE/artifacts/orangefox-vendor_boot.img"
          cp "$GITHUB_WORKSPACE/stock/vendor_boot.img" \
            "$GITHUB_WORKSPACE/artifacts/stock-vendor_boot.img"

          sha256sum \
            "$GITHUB_WORKSPACE/artifacts/vendor_ramdisk_recovery.cpio" \
            "$GITHUB_WORKSPACE/artifacts/final_vendor_ramdisk_recovery.cpio" \
            "$GITHUB_WORKSPACE/artifacts/orangefox-vendor_boot.img" \
            "$GITHUB_WORKSPACE/artifacts/stock-vendor_boot.img" \
            | tee "$GITHUB_WORKSPACE/artifacts/SHA256SUMS"
          {
            echo "device=$DEVICE"
            echo "orangefox_branch=$FOX_BRANCH"
            echo "recovery_ramdisk=vendor_ramdisk_recovery.cpio"
            echo "recovery_ramdisk_size=$(stat -c%s "$cpio")"
            echo "final_recovery_ramdisk=final_vendor_ramdisk_recovery.cpio"
            echo "final_recovery_ramdisk_sha256=$(sha256sum "$final_cpio" | cut -d' ' -f1)"
            echo "orangefox_vendor_boot=orangefox-vendor_boot.img"
            echo "orangefox_vendor_boot_sha256=$image_sha256"
            echo "stock_reference=stock-vendor_boot.img"
          } > "$GITHUB_WORKSPACE/artifacts/build-info.txt"
          (
            cd "$GITHUB_WORKSPACE"
            zip -9 -r "$GITHUB_WORKSPACE/OrangeFox-tanzanite-recovery-ramdisk.zip" \
              artifacts/vendor_ramdisk_recovery.cpio \
              artifacts/final_vendor_ramdisk_recovery.cpio \
              artifacts/vendor_boot_v4_table.txt \
              artifacts/vendorbootimage-build.log \
              artifacts/generated-avb-info.txt \
              artifacts/stock-avb-info.txt \
              artifacts/layout-check.txt \
              artifacts/orangefox-vendor_boot.img \
              artifacts/stock-vendor_boot.img \
              artifacts/SHA256SUMS \
              artifacts/build-info.txt
          )
          unzip -Z1 "$GITHUB_WORKSPACE/OrangeFox-tanzanite-recovery-ramdisk.zip" \
            > "$GITHUB_WORKSPACE/artifacts/zip-contents.txt"
          ! grep -Fxq 'OrangeFox-tanzanite-recovery-ramdisk.zip' \
            "$GITHUB_WORKSPACE/artifacts/zip-contents.txt"

      - name: Upload OrangeFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-tanzanite-recovery-ramdisk
          if-no-files-found: error
          path: |
            OrangeFox-tanzanite-recovery-ramdisk.zip
            artifacts/

      - name: Upload OrangeFox release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="orangefox-tanzanite-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "OrangeFox Tanzanite $GITHUB_RUN_NUMBER" \
            --notes "Validated OrangeFox vendor_boot for tanzanite, OS3.0.303.0.WOGMIXM." \
            "$GITHUB_WORKSPACE/OrangeFox-tanzanite-recovery-ramdisk.zip" \
            "$GITHUB_WORKSPACE/artifacts/orangefox-vendor_boot.img" \
            "$GITHUB_WORKSPACE/artifacts/stock-vendor_boot.img" \
            "$GITHUB_WORKSPACE/artifacts/SHA256SUMS" \
            "$GITHUB_WORKSPACE/artifacts/build-info.txt" \
            "$GITHUB_WORKSPACE/artifacts/vendor_boot_v4_table.txt" \
            "$GITHUB_WORKSPACE/artifacts/layout-check.txt" \
            "$GITHUB_WORKSPACE/artifacts/generated-avb-info.txt" \
            "$GITHUB_WORKSPACE/artifacts/stock-avb-info.txt"
